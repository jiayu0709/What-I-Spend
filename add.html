<!doctype html>
<html lang="zh-Hant">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="theme.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="What I Spend">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>新增</title>

  <style>
  .segment{
    display:grid;
    grid-template-columns: 1fr 1fr;
    background: var(--card-bg);
    border-radius: 12px;
    padding: 4px;
  }

  .seg-btn{
    border:0;
    background:transparent;
    padding:10px 0;
    border-radius:10px;
    font-weight:800;
    color:var(--secondary);
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    -webkit-user-select:none;
  }

  .seg-btn.active{
    background:#fff;
    color:var(--text);
  }

  .field-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    min-width:0;
  }

  input[type="date"]{
    display:block;
    appearance:none;
    -webkit-appearance:none;
  }

  .amount-card{
    display:grid;
    gap:12px;
    padding:14px;
    border-radius:16px;
    background:rgba(255,255,255,0.56);
    border:1px solid rgba(0,0,0,0.06);
  }

  .amount-main{
    display:grid;
    grid-template-columns:110px 1fr;
    gap:12px;
    align-items:center;
    min-height:56px;
  }

  .currency-pill{
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#fff;
    border:1px solid rgba(0,0,0,0.08);
    font-weight:900;
    font-size:18px;
    color:var(--text);
  }

  .amount-input{
    width:100%;
    height:56px;
    border:0;
    background:transparent;
    outline:none;
    font-size:34px;
    line-height:56px;
    font-weight:900;
    color:var(--text);
    padding:0;
    margin:0;
    min-width:0;
  }

  .amount-input::placeholder{
    color:#b4b4b4;
    font-weight:800;
  }

  .fx-wrap{
    display:grid;
    gap:10px;
    padding-top:2px;
  }

  .fx-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }

  .preview-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:12px;
    border-radius:12px;
    background:rgba(255,255,255,0.72);
    border:1px solid rgba(0,0,0,0.06);
  }

  .preview-value{
    font-size:18px;
    font-weight:900;
    color:var(--text);
    white-space:nowrap;
  }

  .hidden{
    display:none !important;
  }

  .note-input{
    min-height:48px;
  }

  .save:disabled{
    opacity:.6;
    cursor:not-allowed;
  }
  </style>
</head>

<body>
  <div class="app">
    <main class="page">
      <div class="nav">
        <div class="nav-left"></div>
        <div class="nav-title">新增</div>
        <div class="nav-right">
          <div class="book-badge" id="bookBadge" style="display:none;"></div>
        </div>
      </div>

      <section class="section">
        <div class="segment" role="tablist" aria-label="類型">
          <button class="seg-btn active" id="btn-expense" type="button" aria-pressed="true">支出</button>
          <button class="seg-btn" id="btn-income" type="button" aria-pressed="false">收入</button>
        </div>
      </section>

      <section class="section">
        <div class="card">
          <div class="form-grid">
            <div class="field">
              <div class="label">日期</div>
              <input class="input" type="date" id="date" />
            </div>

            <div class="field-row">
              <div class="field">
                <div class="label">分類</div>
                <select class="input" id="category"></select>
              </div>

              <div class="field">
                <div class="label">幣別</div>
                <select class="input" id="currency"></select>
              </div>
            </div>

            <div class="field">
              <div class="label">金額</div>
              <div class="amount-card">
                <div class="amount-main">
                  <div class="currency-pill" id="currencyPill">TWD</div>
                  <input
                    class="amount-input"
                    type="number"
                    id="amount"
                    inputmode="decimal"
                    placeholder="0"
                  />
                </div>

                <div class="fx-wrap" id="fxWrap">
                  <div class="fx-row">
                    <div class="field">
                      <div class="label">匯率</div>
                      <input
                        class="input"
                        type="number"
                        id="fxRate"
                        inputmode="decimal"
                        placeholder="1 外幣 = 幾 TWD"
                      />
                    </div>

                    <div class="field">
                      <div class="label">台幣金額</div>
                      <div class="preview-box">
                        <div class="preview-value" id="amountTWDPreview">NT$0</div>
                      </div>
                    </div>
                  </div>

                  <div class="hint" id="fxHint">
                    預設帶入臺灣銀行即期賣出匯率；使用者也可自行修改匯率。
                  </div>
                </div>
              </div>
            </div>

            <div class="field">
              <div class="label">備註</div>
              <input class="input note-input" type="text" id="note" placeholder="備註（可空）" />
            </div>
          </div>
        </div>

        <button class="save" id="saveBtn" type="button" disabled>儲存</button>
      </section>
    </main>

    <nav class="tabbar" aria-label="Tab Bar">
      <div class="tabbar-inner">
        <button class="tab" type="button" data-href="add.html"><div class="icon">＋</div><div>新增</div></button>
        <button class="tab" type="button" data-href="month.html"><div class="icon">▦</div><div>本月</div></button>
        <button class="tab" type="button" data-href="year.html"><div class="icon">⛁</div><div>統計</div></button>
      </div>
    </nav>
  </div>

  <script type="module" src="app.js"></script>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      addDoc, collection, serverTimestamp,
      doc, getDoc, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const LS_BOOK = "wis_currentBookId";

    const DEFAULT_CATEGORIES = {
      expense: ["餐飲🥣","飲料🥤","交通🛵","日用🛍️","娛樂🎮","醫療🏥","治裝👗","家用🏠","旅遊🧳","其他🧶"],
      income:  ["薪資💼","獎金🎁","兼職🧑‍💻","投資📈","退款💵","其他🧶"],
    };

    const DEFAULT_SETTINGS = {
      defaultCurrency: "TWD",
      primaryDisplayCurrency: "TWD",
      foreignCurrency: "",
    };

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");

    const btnExpense = $("btn-expense");
    const btnIncome  = $("btn-income");
    const categorySelect = $("category");
    const currencySelect = $("currency");
    const currencyPill = $("currencyPill");
    const fxWrap = $("fxWrap");
    const fxRateInput = $("fxRate");
    const fxHint = $("fxHint");
    const amountTWDPreview = $("amountTWDPreview");
    const dateInput = $("date");
    const amountInput = $("amount");
    const noteInput = $("note");
    const saveBtn = $("saveBtn");

    let BOOK_CATEGORIES = structuredClone(DEFAULT_CATEGORIES);
    let BOOK_SETTINGS = { ...DEFAULT_SETTINGS };
    let AVAILABLE_CURRENCIES = ["TWD"];
    let currentType = "expense";

    const todayYMD = () => {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    };

    const nowHHMM = () => {
      const d = new Date();
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    };

    const monthKeyFromDateStr = (ymd) =>
      (ymd && /^\d{4}-\d{2}-\d{2}$/.test(ymd)) ? ymd.slice(0, 7) : "";

    const parseAmount = (v) => {
      const n = Number(String(v ?? "").replace(/,/g, ""));
      return isFinite(n) ? n : NaN;
    };

    const moneyNT = (n) => {
      const v = Number(n || 0);
      return "NT$" + Math.round(v).toLocaleString("en-US");
    };

    function isSupportedCurrency(v) {
      return AVAILABLE_CURRENCIES.includes(String(v || "").toUpperCase());
    }

    function buildAvailableCurrencies(settings) {
      const list = ["TWD"];
      const foreign = String(settings?.foreignCurrency || "").toUpperCase();

      if (foreign && foreign !== "TWD" && ["USD", "EUR"].includes(foreign)) {
        list.push(foreign);
      }

      return list;
    }

    function renderCurrencyOptions(selectedValue = "") {
      const prev = selectedValue || currencySelect.value || "TWD";

      currencySelect.innerHTML = "";

      for (const c of AVAILABLE_CURRENCIES) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        currencySelect.appendChild(opt);
      }

      currencySelect.value = isSupportedCurrency(prev) ? prev : "TWD";
    }

    async function fetchDefaultFxRate(currency) {
      const c = String(currency || "TWD").toUpperCase();

      if (c === "TWD") return 1;

      const res = await fetch(`/.netlify/functions/getFxRate?currency=${encodeURIComponent(c)}`);
      const text = await res.text();

      if (!res.ok) {
        throw new Error(text || `匯率讀取失敗 (${res.status})`);
      }

      const data = JSON.parse(text);
      const rate = Number(data?.rate);

      if (!Number.isFinite(rate) || rate <= 0) {
        throw new Error("匯率格式錯誤");
      }

      return rate;
    }

    async function loadBookCategories(uid){
      const bookId = localStorage.getItem(LS_BOOK);
      if (!bookId) return;

      const bookRef = doc(db, "users", uid, "books", bookId);
      const snap = await getDoc(bookRef);
      const data = snap.data() || {};
      const c = data.categories;

      const ok =
        c &&
        Array.isArray(c.expense) && c.expense.length &&
        Array.isArray(c.income)  && c.income.length;

      if (ok) {
        BOOK_CATEGORIES = { expense: c.expense, income: c.income };
        return;
      }

      await updateDoc(bookRef, { categories: DEFAULT_CATEGORIES });
      BOOK_CATEGORIES = structuredClone(DEFAULT_CATEGORIES);
    }

    async function loadBookSettings(uid){
      const bookId = localStorage.getItem(LS_BOOK);
      if (!bookId) {
        BOOK_SETTINGS = { ...DEFAULT_SETTINGS };
        AVAILABLE_CURRENCIES = buildAvailableCurrencies(BOOK_SETTINGS);
        return BOOK_SETTINGS;
      }

      const bookRef = doc(db, "users", uid, "books", bookId);
      const snap = await getDoc(bookRef);
      const data = snap.data() || {};
      const settings = data.settings || {};

      BOOK_SETTINGS = {
        defaultCurrency: settings.defaultCurrency || "TWD",
        primaryDisplayCurrency: settings.primaryDisplayCurrency || "TWD",
        foreignCurrency: settings.foreignCurrency || "",
      };

      AVAILABLE_CURRENCIES = buildAvailableCurrencies(BOOK_SETTINGS);
      return BOOK_SETTINGS;
    }

    function categoriesFor(type){
      return type === "income" ? BOOK_CATEGORIES.income : BOOK_CATEGORIES.expense;
    }

    function renderCategoryOptions(type){
      const list = categoriesFor(type);
      const safeList = (Array.isArray(list) && list.length)
        ? list
        : (type === "income" ? DEFAULT_CATEGORIES.income : DEFAULT_CATEGORIES.expense);

      const prev = categorySelect.value;

      categorySelect.innerHTML = "";
      for (const name of safeList) {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        categorySelect.appendChild(opt);
      }

      categorySelect.value = safeList.includes(prev) ? prev : safeList[0];
    }

    async function updateCurrencyUI({ autoFetch = true } = {}) {
      const currency = currencySelect.value || "TWD";
      currencyPill.textContent = currency;

      const isTWD = currency === "TWD";
      fxWrap.classList.toggle("hidden", isTWD);

      if (isTWD) {
        fxRateInput.value = "1";
        fxHint.textContent = "台幣不需匯率換算。";
        updateTWDPreview();
        return;
      }

      fxRateInput.placeholder = `1 ${currency} = 幾 TWD`;
      fxHint.textContent = `預設帶入臺灣銀行 ${currency} 即期賣出匯率；使用者也可自行修改匯率。`;

      if (autoFetch) {
        try {
          fxRateInput.placeholder = "讀取匯率中…";
          const rate = await fetchDefaultFxRate(currency);
          fxRateInput.value = String(rate);
        } catch (e) {
          console.error("自動抓匯率失敗:", e);
          if (!fxRateInput.value) {
            fxRateInput.value = "";
          }
        } finally {
          fxRateInput.placeholder = `1 ${currency} = 幾 TWD`;
        }
      }

      updateTWDPreview();
    }

    function updateTWDPreview() {
      const currency = currencySelect.value || "TWD";
      const amount = parseAmount(amountInput.value);
      const fxRate = parseAmount(fxRateInput.value);

      if (!isFinite(amount) || amount <= 0) {
        amountTWDPreview.textContent = "NT$0";
        return;
      }

      if (currency === "TWD") {
        amountTWDPreview.textContent = moneyNT(amount);
        return;
      }

      if (!isFinite(fxRate) || fxRate <= 0) {
        amountTWDPreview.textContent = "NT$0";
        return;
      }

      amountTWDPreview.textContent = moneyNT(amount * fxRate);
    }

    function setType(type){
      currentType = (type === "income") ? "income" : "expense";
      const isExpense = currentType === "expense";

      btnExpense.classList.toggle("active", isExpense);
      btnIncome.classList.toggle("active", !isExpense);

      btnExpense.setAttribute("aria-pressed", String(isExpense));
      btnIncome.setAttribute("aria-pressed", String(!isExpense));

      renderCategoryOptions(currentType);
    }

    async function ensureLoginOrRedirect(){
      const user = await window.waitForAuthReady();
      if (user) return user;

      const next = encodeURIComponent(location.href);
      location.replace(`index.html?next=${next}`);
      return null;
    }

    async function addViaFunction(payload){
      const u = auth.currentUser;
      if (!u) throw new Error("Not logged in");

      const token = await u.getIdToken();
      const res = await fetch("/.netlify/functions/addTransaction", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const text = await res.text();
        console.error("Function error status:", res.status, "body:", text);
        throw new Error(text || `Function failed: ${res.status}`);
      }

      return res.json().catch(() => ({}));
    }

    async function addViaClientFirestore(payload){
      const u = auth.currentUser;
      if (!u) throw new Error("Not logged in");

      await addDoc(
        collection(db, "users", u.uid, "transactions"),
        { ...payload, createdAt: serverTimestamp() }
      );
    }

    async function writeTransaction(payload, { prefer = "function" } = {}){
      const u = auth.currentUser;
      if (!u) throw new Error("Not logged in");

      const isLocalhost =
        location.hostname === "localhost" || location.hostname === "127.0.0.1";

      const functionFirst = (prefer === "function") && !isLocalhost;

      if (functionFirst) {
        try {
          await addViaFunction(payload);
          return { via: "function" };
        } catch (e) {
          console.warn("Function write failed; fallback to client Firestore:", e);
          await addViaClientFirestore(payload);
          return { via: "client_fallback" };
        }
      }

      try {
        await addViaClientFirestore(payload);
        return { via: "client" };
      } catch (e) {
        console.warn("Client write failed; fallback to function:", e);
        await addViaFunction(payload);
        return { via: "function_fallback" };
      }
    }

    async function saveToFirestore({ redirectAfter = true } = {}){
      const user = await ensureLoginOrRedirect();
      if (!user) return;

      const date = dateInput.value || todayYMD();
      const time = nowHHMM();
      const category = (categorySelect.value || "").trim();
      const note = (noteInput.value || "").trim();
      const amount = parseAmount(amountInput.value);
      const currency = currencySelect.value || "TWD";

      if (!category) {
        await window.ui.alert("請選擇分類");
        return;
      }

      if (!isFinite(amount) || amount <= 0) {
        await window.ui.alert("請輸入正確金額（> 0）");
        return;
      }

      let fxRateToTWD = 1;
      let amountTWD = amount;

      if (currency !== "TWD") {
        fxRateToTWD = parseAmount(fxRateInput.value);
        if (!isFinite(fxRateToTWD) || fxRateToTWD <= 0) {
          await window.ui.alert("請輸入正確匯率（> 0）");
          return;
        }
        amountTWD = amount * fxRateToTWD;
      }

      const bookId = localStorage.getItem(LS_BOOK);
      if (!bookId) {
        location.replace("books.html");
        return;
      }

      const payload = {
        bookId,
        date,
        time,
        type: currentType,
        amount,
        category,
        note,
        currency,
        fxRateToTWD,
        amountTWD,
      };

      await writeTransaction(payload, { prefer: "client" });

      if (redirectAfter) {
        const ym = monthKeyFromDateStr(date);
        const b = encodeURIComponent(bookId);
        location.replace(ym ? `month.html?m=${ym}&b=${b}` : `month.html?b=${b}`);
      }
    }

    dateInput.value = todayYMD();
    setType("expense");

    btnExpense.addEventListener("click", () => setType("expense"));
    btnIncome.addEventListener("click", () => setType("income"));

    currencySelect.addEventListener("change", async () => {
      await updateCurrencyUI({ autoFetch: true });
    });
    amountInput.addEventListener("input", updateTWDPreview);
    fxRateInput.addEventListener("input", updateTWDPreview);

    const qs = new URLSearchParams(location.search);
    const qsType = qs.get("type");
    const qsAmount = qs.get("amount");
    const qsCategory = qs.get("category");
    const qsNote = qs.get("note");
    const qsDate = qs.get("date");
    const qsCurrency = qs.get("currency");
    const qsFxRate = qs.get("fxRate");

    if (qsType === "income" || qsType === "expense") setType(qsType);
    if (qsDate && /^\d{4}-\d{2}-\d{2}$/.test(qsDate)) dateInput.value = qsDate;
    if (qsAmount) amountInput.value = qsAmount;
    if (qsNote) noteInput.value = qsNote;
    if (qsFxRate) fxRateInput.value = qsFxRate;

    await window.firebaseReady;

    const initialUser = await window.waitForAuthReady();
    const uid = initialUser?.uid || null;

    if (uid) {
      await window.ensureDefaultBookAndCategories(uid);
      await loadBookCategories(uid);
      await loadBookSettings(uid);

      renderCategoryOptions(currentType);
      renderCurrencyOptions();

      const preferredCurrency =
        (qsCurrency && isSupportedCurrency(qsCurrency)) ? qsCurrency :
        (isSupportedCurrency(BOOK_SETTINGS.defaultCurrency) ? BOOK_SETTINGS.defaultCurrency : "TWD");

      currencySelect.value = preferredCurrency;

      if (qsCategory && [...categorySelect.options].some(o => o.value === qsCategory)) {
        categorySelect.value = qsCategory;
      }
    } else {
      renderCurrencyOptions("TWD");
    }

    await updateCurrencyUI({ autoFetch: true });

    saveBtn.disabled = false;

    saveBtn.addEventListener("click", async () => {
      await window.withButtonFeedback(
        saveBtn,
        async () => { await saveToFirestore({ redirectAfter: true }); },
        {
          loadingText: "儲存中…",
          successText: "已儲存 ✓",
          minShowMs: 120,
          successHoldMs: 800,
          onError: (e) => {
            console.error("save failed:", e);
            window.ui.alert(`儲存失敗: ${e.message || e}`);
          },
        }
      );
    });
  </script>
</body>
</html>
