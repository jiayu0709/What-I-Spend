<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>幣別設定</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="page">
    <div class="nav">
      <div class="nav-left">
        <button class="back-btn" id="backLink" type="button">‹ 返回</button>
      </div>
      <div class="nav-title">幣別設定</div>
      <div class="nav-right">
        <div class="book-badge" id="bookBadge" style="display:none;"></div>
      </div>
    </div>

    <section class="section">
      <div class="card">
        <div class="form-grid">
          <div class="field">
            <div class="label">預設幣別</div>
            <select class="input" id="defaultCurrency">
              <option value="TWD">TWD</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
            </select>
            <div class="hint">新增紀錄時，幣別欄位會預設此幣別。</div>
          </div>

          <div class="field">
            <div class="label">帳本外幣</div>
            <select class="input" id="foreignCurrency">
              <option value="">不使用外幣</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
            </select>
            <div class="hint">一個帳本只使用一種外幣。新增頁之後只會出現 TWD 與這個外幣。</div>
          </div>

          <div class="field">
            <div class="label">主要顯示幣別</div>
            <select class="input" id="primaryDisplayCurrency">
              <option value="TWD">TWD</option>
            </select>
            <div class="hint">本月、統計等頁面會優先以此幣別顯示。</div>
          </div>
        </div>
      </div>

      <button class="save" id="saveBtn" type="button">儲存</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const LS_BOOK = "wis_currentBookId";
    const LS_MONTH_DISPLAY_CURRENCY = "wis_month_display_currency";
    const LS_STATS_DISPLAY_CURRENCY = "wis_stats_display_currency";

    const $ = (id) => document.getElementById(id);

    const DEFAULT_SETTINGS = {
      defaultCurrency: "TWD",
      primaryDisplayCurrency: "TWD",
      foreignCurrency: "",
    };

    function renderPrimaryDisplayOptions(foreignCurrency = "", selectedValue = "TWD") {
      const sel = $("primaryDisplayCurrency");
      const foreign = String(foreignCurrency || "").toUpperCase();
      const allowed = ["TWD"];

      if (foreign === "USD" || foreign === "EUR") {
        allowed.push(foreign);
      }

      sel.innerHTML = "";

      for (const code of allowed) {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = code;
        sel.appendChild(opt);
      }

      sel.value = allowed.includes(selectedValue) ? selectedValue : "TWD";
    }

    function normalizePrimaryDisplayCurrency(primaryDisplayCurrency, foreignCurrency) {
      const primary = String(primaryDisplayCurrency || "TWD").toUpperCase();
      const foreign = String(foreignCurrency || "").toUpperCase();

      if (primary === "TWD") return "TWD";
      if ((foreign === "USD" || foreign === "EUR") && primary === foreign) return foreign;

      return "TWD";
    }

    function normalizeDefaultCurrency(defaultCurrency, foreignCurrency) {
      const def = String(defaultCurrency || "TWD").toUpperCase();
      const foreign = String(foreignCurrency || "").toUpperCase();

      if (def === "TWD") return "TWD";
      if ((foreign === "USD" || foreign === "EUR") && def === foreign) return foreign;

      return "TWD";
    }

    async function renderBookBadge(user, bookId) {
      try {
        const ref = doc(db, "users", user.uid, "books", bookId);
        const snap = await getDoc(ref);
        const data = snap.data() || {};
        const name = (data.name || "未命名帳本").trim();

        const badge = $("bookBadge");
        badge.textContent = name;
        badge.title = name;
        badge.style.display = "inline-flex";
      } catch (e) {
        console.error("renderBookBadge failed:", e);
      }
    }

    async function loadSettings() {
      await window.firebaseReady;

      const user = await window.waitForAuthReady();
      if (!user) {
        location.replace("index.html?next=" + encodeURIComponent(location.href));
        return;
      }

      const bookId = localStorage.getItem(LS_BOOK);
      if (!bookId) {
        location.replace("books.html");
        return;
      }

      await renderBookBadge(user, bookId);

      const ref = doc(db, "users", user.uid, "books", bookId);
      const snap = await getDoc(ref);
      const data = snap.data() || {};
      const settings = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };

      const foreignCurrency = String(settings.foreignCurrency || "").toUpperCase();
      const normalizedPrimary = normalizePrimaryDisplayCurrency(settings.primaryDisplayCurrency, foreignCurrency);
      const normalizedDefault = normalizeDefaultCurrency(settings.defaultCurrency, foreignCurrency);

      $("foreignCurrency").value = foreignCurrency;
      renderPrimaryDisplayOptions(foreignCurrency, normalizedPrimary);

      $("defaultCurrency").value = normalizedDefault;
      $("primaryDisplayCurrency").value = normalizedPrimary;
    }

    async function saveSettings() {
      const user = await window.waitForAuthReady();
      if (!user) return;

      const bookId = localStorage.getItem(LS_BOOK);
      if (!bookId) {
        location.replace("books.html");
        return;
      }

      const foreignCurrency = ($("foreignCurrency").value || "").toUpperCase();

      let defaultCurrency = ($("defaultCurrency").value || "TWD").toUpperCase();
      let primaryDisplayCurrency = ($("primaryDisplayCurrency").value || "TWD").toUpperCase();

      defaultCurrency = normalizeDefaultCurrency(defaultCurrency, foreignCurrency);
      primaryDisplayCurrency = normalizePrimaryDisplayCurrency(primaryDisplayCurrency, foreignCurrency);

      const ref = doc(db, "users", user.uid, "books", bookId);

      await setDoc(ref, {
        settings: {
          defaultCurrency,
          primaryDisplayCurrency,
          foreignCurrency,
        }
      }, { merge: true });

      // 重要：清掉各頁曾記住的顯示幣別，讓頁面回去吃帳本設定
      localStorage.removeItem(LS_MONTH_DISPLAY_CURRENCY);
      localStorage.removeItem(LS_STATS_DISPLAY_CURRENCY);

      await window.ui?.alert?.("幣別設定已儲存");
      history.back();
    }

    $("foreignCurrency").addEventListener("change", () => {
      const foreignCurrency = ($("foreignCurrency").value || "").toUpperCase();

      const currentPrimary = $("primaryDisplayCurrency").value || "TWD";
      renderPrimaryDisplayOptions(foreignCurrency, currentPrimary);

      const currentDefault = ($("defaultCurrency").value || "TWD").toUpperCase();
      $("defaultCurrency").value = normalizeDefaultCurrency(currentDefault, foreignCurrency);
    });

    $("backLink").addEventListener("click", () => {
      history.back();
    });

    $("saveBtn").addEventListener("click", async () => {
      try {
        await saveSettings();
      } catch (e) {
        console.error(e);
        await window.ui?.alert?.("儲存失敗：" + (e.message || e));
      }
    });

    await loadSettings();
  </script>
</body>
</html>
