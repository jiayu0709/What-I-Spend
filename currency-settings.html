<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>幣別設定</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="page">
    <div class="nav">
      <div class="nav-left">
        <button class="back-btn" id="backLink" type="button">‹ 返回</button>
      </div>
      <div class="nav-title">幣別設定</div>
      <div class="nav-right">
        <div class="book-badge" id="bookBadge" style="display:none;"></div>
      </div>
    </div>

    <section class="section">
      <div class="card">
        <div class="form-grid">
          <div class="field">
            <div class="label">帳本外幣</div>
            <select class="input" id="foreignCurrency">
              <option value="">不使用外幣</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
            </select>
            <div class="hint">一個帳本只使用一種外幣。頁面只會顯示 TWD 與這個外幣。</div>
          </div>

          <div class="field">
            <div class="label">預設幣別</div>
            <select class="input" id="defaultCurrency">
              <option value="TWD">TWD</option>
            </select>
            <div class="hint">新增紀錄時，會預設使用這個幣別。</div>
          </div>

          <div class="field">
            <div class="label">主要顯示幣別</div>
            <select class="input" id="primaryDisplayCurrency">
              <option value="TWD">TWD</option>
            </select>
            <div class="hint">本月、統計等頁面會優先以此幣別顯示。</div>
          </div>
        </div>
      </div>

      <button class="save" id="saveBtn" type="button">儲存</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.pageLoader?.show("讀取中…");

    const LS_BOOK = "wis_currentBookId";
    const LS_MONTH_DISPLAY_CURRENCY = "wis_month_display_currency";
    const LS_STATS_DISPLAY_CURRENCY = "wis_stats_display_currency";

    const $ = (id) => document.getElementById(id);

    const DEFAULT_SETTINGS = {
      defaultCurrency: "TWD",
      primaryDisplayCurrency: "TWD",
      foreignCurrency: "",
    };

    const els = {
      backLink: $("backLink"),
      bookBadge: $("bookBadge"),
      foreignCurrency: $("foreignCurrency"),
      defaultCurrency: $("defaultCurrency"),
      primaryDisplayCurrency: $("primaryDisplayCurrency"),
      saveBtn: $("saveBtn"),
    };

    let currentUser = null;
    let currentBookId = "";
    let currentBookData = {};

    function normalizeCurrency(v) {
      return String(v || "").trim().toUpperCase();
    }

    function buildAllowedCurrencies(foreignCurrency = "") {
      const list = ["TWD"];
      const foreign = normalizeCurrency(foreignCurrency);

      if (foreign === "USD" || foreign === "EUR") {
        list.push(foreign);
      }

      return list;
    }

    function normalizePrimaryDisplayCurrency(primaryDisplayCurrency, foreignCurrency) {
      const primary = normalizeCurrency(primaryDisplayCurrency || "TWD");
      const allowed = buildAllowedCurrencies(foreignCurrency);
      return allowed.includes(primary) ? primary : "TWD";
    }

    function normalizeDefaultCurrency(defaultCurrency, foreignCurrency) {
      const def = normalizeCurrency(defaultCurrency || "TWD");
      const allowed = buildAllowedCurrencies(foreignCurrency);
      return allowed.includes(def) ? def : "TWD";
    }

    function renderCurrencyOptions(selectEl, foreignCurrency = "", selectedValue = "TWD") {
      const allowed = buildAllowedCurrencies(foreignCurrency);
      selectEl.innerHTML = "";

      for (const code of allowed) {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = code;
        selectEl.appendChild(opt);
      }

      selectEl.value = allowed.includes(selectedValue) ? selectedValue : "TWD";
    }

    function renderBookBadge(bookData = {}) {
      const name = String(bookData?.name || "未命名帳本").trim();
      if (!name) {
        els.bookBadge.style.display = "none";
        return;
      }

      els.bookBadge.textContent = name;
      els.bookBadge.title = name;
      els.bookBadge.style.display = "inline-flex";
    }

    async function getBookData(uid, bookId, { force = false } = {}) {
      if (!uid) throw new Error("Missing uid");
      if (!bookId) throw new Error("Missing bookId");

      if (!force) {
        const cached = window.dataUtils?.getCachedBook(uid, bookId);
        if (cached) return cached;
      }

      const ref = doc(db, "users", uid, "books", bookId);
      const snap = await getDoc(ref);
      const data = snap.exists() ? (snap.data() || {}) : {};

      window.dataUtils?.setCachedBook(uid, bookId, data);
      return data;
    }

    function applySettingsToUI(settings = {}) {
      const foreignCurrency = normalizeCurrency(settings.foreignCurrency || "");
      const normalizedDefault = normalizeDefaultCurrency(settings.defaultCurrency, foreignCurrency);
      const normalizedPrimary = normalizePrimaryDisplayCurrency(settings.primaryDisplayCurrency, foreignCurrency);

      els.foreignCurrency.value =
        foreignCurrency === "USD" || foreignCurrency === "EUR" ? foreignCurrency : "";

      renderCurrencyOptions(els.defaultCurrency, foreignCurrency, normalizedDefault);
      renderCurrencyOptions(els.primaryDisplayCurrency, foreignCurrency, normalizedPrimary);
    }

    function syncDependentCurrencySelectors() {
      const foreignCurrency = normalizeCurrency(els.foreignCurrency.value || "");
      const currentDefault = normalizeCurrency(els.defaultCurrency.value || "TWD");
      const currentPrimary = normalizeCurrency(els.primaryDisplayCurrency.value || "TWD");

      const normalizedDefault = normalizeDefaultCurrency(currentDefault, foreignCurrency);
      const normalizedPrimary = normalizePrimaryDisplayCurrency(currentPrimary, foreignCurrency);

      renderCurrencyOptions(els.defaultCurrency, foreignCurrency, normalizedDefault);
      renderCurrencyOptions(els.primaryDisplayCurrency, foreignCurrency, normalizedPrimary);
    }

    async function loadPage() {
      await window.firebaseReady;

      currentUser = await window.waitForAuthReady();
      if (!currentUser) {
        location.replace("index.html?next=" + encodeURIComponent(location.href));
        return;
      }

      currentBookId = localStorage.getItem(LS_BOOK) || "";
      if (!currentBookId) {
        location.replace("books.html");
        return;
      }

      currentBookData = await getBookData(currentUser.uid, currentBookId);
      renderBookBadge(currentBookData);

      const settings = { ...DEFAULT_SETTINGS, ...(currentBookData.settings || {}) };
      applySettingsToUI(settings);
    }

    async function saveSettings() {
      if (!currentUser) {
        currentUser = await window.waitForAuthReady();
      }
      if (!currentUser) return;

      currentBookId = currentBookId || localStorage.getItem(LS_BOOK) || "";
      if (!currentBookId) {
        location.replace("books.html");
        return;
      }

      const foreignCurrency = normalizeCurrency(els.foreignCurrency.value || "");
      let defaultCurrency = normalizeCurrency(els.defaultCurrency.value || "TWD");
      let primaryDisplayCurrency = normalizeCurrency(els.primaryDisplayCurrency.value || "TWD");

      defaultCurrency = normalizeDefaultCurrency(defaultCurrency, foreignCurrency);
      primaryDisplayCurrency = normalizePrimaryDisplayCurrency(primaryDisplayCurrency, foreignCurrency);

      const nextSettings = {
        foreignCurrency,
        defaultCurrency,
        primaryDisplayCurrency,
      };

      const ref = doc(db, "users", currentUser.uid, "books", currentBookId);
      await setDoc(ref, { settings: nextSettings }, { merge: true });

      currentBookData = {
        ...(currentBookData || {}),
        settings: nextSettings,
      };

      window.dataUtils?.setCachedBook(currentUser.uid, currentBookId, currentBookData);
      window.dataUtils?.clearWalletCache(currentUser.uid, currentBookId);

      localStorage.removeItem(LS_MONTH_DISPLAY_CURRENCY);
      localStorage.removeItem(LS_STATS_DISPLAY_CURRENCY);

      applySettingsToUI(nextSettings);

      await window.ui?.alert?.("幣別設定已儲存");
      history.back();
    }

    els.foreignCurrency.addEventListener("change", () => {
      syncDependentCurrencySelectors();
    });

    els.backLink.addEventListener("click", () => {
      history.back();
    });

    els.saveBtn.addEventListener("click", async () => {
      await window.withButtonFeedback(
        els.saveBtn,
        async () => { await saveSettings(); },
        {
          loadingText: "儲存中…",
          successText: "已儲存 ✓",
          minShowMs: 120,
          successHoldMs: 700,
          onError: async (e) => {
            console.error(e);
            await window.ui?.alert?.("儲存失敗：" + (e.message || e));
          },
        }
      );
    });

    try {
      await loadPage();
    } finally {
      window.pageLoader?.hide();
    }
  </script>
</body>
</html>
