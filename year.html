<!doctype html>
<html lang="zh-Hant">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="theme.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="What I Spend">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>分析</title>

  <style>
    .range-wrap{
      position:relative;
      margin-top:6px;
      z-index:20;
    }

    .monthbar{
      margin-top:0;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      position:relative;
      z-index:1;
    }

    .monthbar .m-btn{
      border:0;
      background: transparent;
      padding:10px 12px;
      border-radius:12px;
      font-weight:900;
      color: var(--accent-text, var(--accent));
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
    }

    .m-title-btn{
      border:0;
      background:transparent;
      padding:10px 14px;
      border-radius:12px;
      font-weight:900;
      letter-spacing:-.2px;
      color: var(--text);
      white-space:nowrap;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      font-size:16px;
      min-width:0;
      max-width:100%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .m-title-btn #monthLabel{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .m-title-caret{
      flex:0 0 auto;
      font-size:12px;
      color:var(--secondary);
      opacity:.8;
      line-height:1;
    }

    .toolbar-switches{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:10px;
      margin-bottom:12px;
      align-items:start;
      position:relative;
      z-index:15;
    }

    .dropdown{
      position:relative;
      min-width:0;
    }

    .dropdown-btn{
      width:100%;
      border:0;
      background:rgba(255,255,255,0.45);
      border:1px solid rgba(0,0,0,0.06);
      border-radius:12px;
      padding:14px 38px 14px 14px;
      font-size:15px;
      font-weight:900;
      color:var(--text);
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      position:relative;
    }

    .dropdown-btn::after{
      content:"▾";
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      font-size:12px;
      color:var(--secondary);
      pointer-events:none;
    }

    .dropdown.open .dropdown-btn{
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .dropdown-menu{
      position:absolute;
      top:calc(100% + 8px);
      left:0;
      right:0;
      display:grid;
      gap:8px;
      background:var(--card-bg);
      border-radius:var(--radius);
      padding:10px;
      z-index:40;
      box-shadow:
        0 12px 30px rgba(0,0,0,0.12),
        0 2px 8px rgba(0,0,0,0.06);
    }

    .dropdown-menu-btn{
      border:0;
      background:rgba(255,255,255,0.45);
      border:1px solid rgba(0,0,0,0.06);
      border-radius:12px;
      padding:12px 14px;
      text-align:center;
      font-size:15px;
      font-weight:900;
      color:var(--text);
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .dropdown-menu-btn.active{
      background:var(--accent-text);
      color:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .card.card--empty{
      background:transparent;
      padding:0;
    }

    .donut-wrap{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
      align-items:center;
    }

    .donut-area{
      display:grid;
      place-items:center;
      padding:8px 0 2px;
    }

    .donut-legend{
      margin-top:6px;
      display:grid;
      gap:12px;
    }

    .legend-row{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:10px;
      align-items:center;
      font-size:18px;
      padding:8px 0;
    }

    .legend-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:999px;
      flex:0 0 auto;
    }

    .cat{
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .pct{
      color:var(--secondary);
      font-weight:900;
      width:56px;
      text-align:right;
    }

    .amt{
      font-weight:900;
      width:120px;
      text-align:right;
    }

    .donut-svg{
      width:260px;
      height:260px;
      display:block;
      max-width:100%;
    }

    .center-title{
      font-size:18px;
      font-weight:900;
      fill:var(--secondary);
    }

    .center-value{
      font-size:26px;
      font-weight:900;
      fill:var(--text);
    }

    .hidden{
      display:none !important;
    }
  </style>
</head>

<body>
  <div class="app">
    <main class="page">
      <div class="nav">
        <div class="nav-left"></div>
        <div class="nav-title">統計</div>
        <div class="nav-right">
          <div class="book-badge" id="bookBadge" style="display:none;"></div>
        </div>
      </div>

      <div class="range-wrap">
        <div class="monthbar" aria-label="期間切換">
          <button class="m-btn" type="button" id="btnPrev" aria-label="上一期">&lt;</button>

          <button class="m-title-btn" type="button" id="btnRangePicker" aria-label="選擇統計模式">
            <span id="monthLabel">Loading...</span>
            <span class="m-title-caret">▾</span>
          </button>

          <button class="m-btn" type="button" id="btnNext" aria-label="下一期">&gt;</button>
        </div>

        <div class="dropdown-menu hidden" id="rangeMenu">
          <button class="dropdown-menu-btn" type="button" id="btnModeMonth">以月份統計</button>
          <button class="dropdown-menu-btn" type="button" id="btnModeYear">以年度統計</button>
        </div>
      </div>

      <section class="section">
        <div class="toolbar-switches">
          <div class="dropdown" id="typeDropdown">
            <button class="dropdown-btn" type="button" id="btnTypePicker" aria-label="統計類型選擇">
              <span id="typeLabel">支出</span>
            </button>

            <div class="dropdown-menu hidden" id="typeMenu">
              <button class="dropdown-menu-btn" type="button" id="btnExpense">支出</button>
              <button class="dropdown-menu-btn" type="button" id="btnIncome">收入</button>
            </div>
          </div>

          <div class="dropdown" id="currencyDropdown">
            <button class="dropdown-btn" type="button" id="btnCurrencyPicker" aria-label="顯示幣別選擇">
              <span id="currencyLabel">TWD</span>
            </button>

            <div class="dropdown-menu hidden" id="currencyMenu">
              <button class="dropdown-menu-btn" type="button" id="btnCurTWD">TWD</button>
              <button class="dropdown-menu-btn hidden" type="button" id="btnCurForeign">USD</button>
            </div>
          </div>
        </div>

        <div class="card" id="chartCard">
          <div id="chartRoot" class="donut-wrap"></div>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Tab Bar">
      <div class="tabbar-inner">
        <button class="tab" type="button" data-href="add.html"><div class="icon">＋</div><div>新增</div></button>
        <button class="tab" type="button" data-href="month.html"><div class="icon">▦</div><div>本月</div></button>
        <button class="tab" type="button" data-href="year.html"><div class="icon">⛁</div><div>統計</div></button>
      </div>
    </nav>
  </div>

  <script type="module" src="app.js"></script>

  <script>
    window.pageLoader?.show("讀取中…");

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");

    const monthKeyFromDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;

    const parseMonthKey = (key) => {
      if (!key || !/^\d{4}-\d{2}$/.test(key)) return null;
      const [y, m] = key.split("-").map((n) => parseInt(n, 10));
      if (!y || !m || m < 1 || m > 12) return null;
      return new Date(y, m - 1, 1);
    };

    const addMonths = (dateObj, delta) =>
      new Date(dateObj.getFullYear(), dateObj.getMonth() + delta, 1);

    const addYears = (dateObj, delta) =>
      new Date(dateObj.getFullYear() + delta, 0, 1);

    const monthLabel = (dateObj) =>
      `${dateObj.getFullYear()}-${pad2(dateObj.getMonth() + 1)}`;

    const yearLabel = (dateObj) =>
      `${dateObj.getFullYear()}`;

    const clamp01 = (x) => Math.max(0, Math.min(1, x));

    const qs = new URLSearchParams(location.search);
    let currentMonth =
      parseMonthKey(qs.get("m")) ||
      new Date(new Date().getFullYear(), new Date().getMonth(), 1);

    const LS_BOOK = "wis_currentBookId";
    const LS_STATS_MODE = "wis_stats_mode";
    const LS_STATS_DISPLAY_CURRENCY = "wis_stats_display_currency";
    const LS_STATS_PERIOD = "wis_stats_period";

    const urlBook = qs.get("b");
    if (urlBook) localStorage.setItem(LS_BOOK, urlBook);

    let currentMode = localStorage.getItem(LS_STATS_MODE) || "expense";
    let currentPeriod = localStorage.getItem(LS_STATS_PERIOD) || "month";
    let displayCurrency = localStorage.getItem(LS_STATS_DISPLAY_CURRENCY) || "TWD";
    let foreignCurrency = "";
    let availableCurrencies = ["TWD"];
    let latestStatsTxs = [];
    let firstPaintDone = false;

    function finishFirstPaint() {
      if (firstPaintDone) return;
      firstPaintDone = true;
      window.pageLoader?.hide();
    }

    function isTransferTx(tx) {
      return tx?.isTransfer === true;
    }

    function updateRangeLabel() {
      $("monthLabel").textContent =
        currentPeriod === "year"
          ? yearLabel(currentMonth)
          : monthLabel(currentMonth);
    }

    function getAvailableCurrencies() {
      const list = ["TWD"];
      if (foreignCurrency && foreignCurrency !== "TWD") list.push(foreignCurrency);
      return list;
    }

    function normalizeDisplayCurrency(next) {
      const wanted = String(next || "TWD").toUpperCase();
      return availableCurrencies.includes(wanted) ? wanted : "TWD";
    }

    function formatMoney(currency, amount) {
      const n = Number(amount || 0);

      if (currency === "TWD") {
        return Math.round(n).toLocaleString("en-US");
      }

      return n.toLocaleString("en-US", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2,
      });
    }

    function updateSegUI() {
      $("typeLabel").textContent = currentMode === "income" ? "收入" : "支出";
      $("btnExpense").classList.toggle("active", currentMode === "expense");
      $("btnIncome").classList.toggle("active", currentMode === "income");
    }

    function updateCurrencyUI() {
      const btnForeign = $("btnCurForeign");

      $("currencyLabel").textContent = displayCurrency;
      $("btnCurTWD").classList.toggle("active", displayCurrency === "TWD");

      if (foreignCurrency && foreignCurrency !== "TWD") {
        btnForeign.classList.remove("hidden");
        btnForeign.textContent = foreignCurrency;
        btnForeign.classList.toggle("active", displayCurrency === foreignCurrency);
      } else {
        btnForeign.classList.add("hidden");
        btnForeign.classList.remove("active");
      }
    }

    function updatePeriodMenuUI() {
      $("btnModeMonth").classList.toggle("active", currentPeriod === "month");
      $("btnModeYear").classList.toggle("active", currentPeriod === "year");
    }

    function applyDisplayCurrency(next) {
      displayCurrency = normalizeDisplayCurrency(next);
      localStorage.setItem(LS_STATS_DISPLAY_CURRENCY, displayCurrency);
      updateCurrencyUI();
    }

    function applyBookCurrencySettings(settings = {}) {
      foreignCurrency = String(settings.foreignCurrency || "").toUpperCase();
      if (!["USD", "EUR"].includes(foreignCurrency)) {
        foreignCurrency = "";
      }

      availableCurrencies = getAvailableCurrencies();

      const preferred = String(settings.primaryDisplayCurrency || "TWD").toUpperCase();
      const saved = localStorage.getItem(LS_STATS_DISPLAY_CURRENCY) || "";
      const nextDisplay = normalizeDisplayCurrency(saved || preferred || "TWD");

      applyDisplayCurrency(nextDisplay);
    }

    function closeAllMenus() {
      $("rangeMenu").classList.add("hidden");
      $("typeMenu").classList.add("hidden");
      $("currencyMenu").classList.add("hidden");
      $("typeDropdown").classList.remove("open");
      $("currencyDropdown").classList.remove("open");
    }

    function toggleMenu(menuId, shouldShow, dropdownId = null) {
      if (shouldShow) closeAllMenus();
      $(menuId).classList.toggle("hidden", !shouldShow);
      if (dropdownId) $(dropdownId).classList.toggle("open", shouldShow);
    }

    function updatePeriodUI() {
      updateRangeLabel();
      updatePeriodMenuUI();
    }

    window.__applyBookCurrencySettings = applyBookCurrencySettings;

    $("btnRangePicker").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMenu("rangeMenu", $("rangeMenu").classList.contains("hidden"));
    });

    $("btnTypePicker").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMenu("typeMenu", $("typeMenu").classList.contains("hidden"), "typeDropdown");
    });

    $("btnCurrencyPicker").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMenu("currencyMenu", $("currencyMenu").classList.contains("hidden"), "currencyDropdown");
    });

    $("btnModeMonth").addEventListener("click", async () => {
      currentPeriod = "month";
      localStorage.setItem(LS_STATS_PERIOD, currentPeriod);
      updatePeriodUI();
      closeAllMenus();
      await window.__reloadStatsRange?.();
    });

    $("btnModeYear").addEventListener("click", async () => {
      currentPeriod = "year";
      localStorage.setItem(LS_STATS_PERIOD, currentPeriod);
      updatePeriodUI();
      closeAllMenus();
      await window.__reloadStatsRange?.();
    });

    $("btnExpense").addEventListener("click", async () => {
      currentMode = "expense";
      localStorage.setItem(LS_STATS_MODE, currentMode);
      updateSegUI();
      closeAllMenus();
      await window.__renderCurrentStatsMode();
    });

    $("btnIncome").addEventListener("click", async () => {
      currentMode = "income";
      localStorage.setItem(LS_STATS_MODE, currentMode);
      updateSegUI();
      closeAllMenus();
      await window.__renderCurrentStatsMode();
    });

    $("btnCurTWD").addEventListener("click", async () => {
      applyDisplayCurrency("TWD");
      closeAllMenus();
      await window.__renderCurrentStatsMode();
    });

    $("btnCurForeign").addEventListener("click", async () => {
      if (!foreignCurrency) return;
      applyDisplayCurrency(foreignCurrency);
      closeAllMenus();
      await window.__renderCurrentStatsMode();
    });

    document.addEventListener("click", (e) => {
      const rangeWrap = document.querySelector(".range-wrap");
      const typeDropdown = $("typeDropdown");
      const currencyDropdown = $("currencyDropdown");

      if (
        !rangeWrap.contains(e.target) &&
        !typeDropdown.contains(e.target) &&
        !currencyDropdown.contains(e.target)
      ) {
        closeAllMenus();
      }
    });

    $("btnPrev").addEventListener("click", async () => {
      currentMonth =
        currentPeriod === "year"
          ? addYears(currentMonth, -1)
          : addMonths(currentMonth, -1);

      updatePeriodUI();
      closeAllMenus();
      await window.__reloadStatsRange?.();
    });

    $("btnNext").addEventListener("click", async () => {
      currentMonth =
        currentPeriod === "year"
          ? addYears(currentMonth, 1)
          : addMonths(currentMonth, 1);

      updatePeriodUI();
      closeAllMenus();
      await window.__reloadStatsRange?.();
    });

    updatePeriodUI();
    updateSegUI();
    updateCurrencyUI();

    const polarToCartesian = (cx, cy, r, angleDeg) => {
      const rad = ((angleDeg - 90) * Math.PI) / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    };

    const describeArc = (cx, cy, r, startAngle, endAngle) => {
      const start = polarToCartesian(cx, cy, r, endAngle);
      const end = polarToCartesian(cx, cy, r, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      return ["M", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y].join(" ");
    };

    const expensePalette = [
      "#D97B66", "#C98BB9", "#8FA7D6", "#7FC8C2", "#9BCB8F",
      "#E7B56A", "#C6A0E1", "#E38A8A", "#7FB7A3", "#A89F91",
    ];

    const incomePalette = [
      "#69B578", "#6CC3A0", "#7EC8E3", "#8FA7D6", "#A7D49B",
      "#F0C36E", "#B8A1E3", "#73C0AE", "#9FD3C7", "#B7C9F2",
    ];

    function buildDonutSVG(total, slices, centerTitle, centerValueText) {
      const size = 260;
      const cx = size / 2;
      const cy = size / 2;
      const r = 92;
      const stroke = 34;

      let start = 0;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
      svg.setAttribute("class", "donut-svg");

      const bg = document.createElementNS(svg.namespaceURI, "circle");
      bg.setAttribute("cx", cx);
      bg.setAttribute("cy", cy);
      bg.setAttribute("r", r);
      bg.setAttribute("fill", "none");
      bg.setAttribute("stroke", "rgba(0,0,0,0.06)");
      bg.setAttribute("stroke-width", stroke);
      svg.appendChild(bg);

      for (const s of slices) {
        const ratio = total > 0 ? s.value / total : 0;
        const sweep = 360 * ratio;
        const end = start + sweep;

        if (ratio >= 0.999999) {
          const circle = document.createElementNS(svg.namespaceURI, "circle");
          circle.setAttribute("cx", cx);
          circle.setAttribute("cy", cy);
          circle.setAttribute("r", r);
          circle.setAttribute("fill", "none");
          circle.setAttribute("stroke", s.color);
          circle.setAttribute("stroke-width", stroke);
          svg.appendChild(circle);
          start = end;
          continue;
        }

        const path = document.createElementNS(svg.namespaceURI, "path");
        path.setAttribute("d", describeArc(cx, cy, r, start, end));
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", s.color);
        path.setAttribute("stroke-width", stroke);
        path.setAttribute("stroke-linecap", "butt");
        svg.appendChild(path);

        start = end;
      }

      const t1 = document.createElementNS(svg.namespaceURI, "text");
      t1.setAttribute("x", cx);
      t1.setAttribute("y", cy - 4);
      t1.setAttribute("text-anchor", "middle");
      t1.setAttribute("class", "center-title");
      t1.textContent = centerTitle;
      svg.appendChild(t1);

      const t2 = document.createElementNS(svg.namespaceURI, "text");
      t2.setAttribute("x", cx);
      t2.setAttribute("y", cy + 26);
      t2.setAttribute("text-anchor", "middle");
      t2.setAttribute("class", "center-value");
      t2.textContent = centerValueText;
      svg.appendChild(t2);

      return svg;
    }

    async function fetchRateToTWD(currency) {
      const c = String(currency || "TWD").toUpperCase();
      if (c === "TWD") return 1;

      const res = await fetch(`/.netlify/functions/getFxRate?currency=${encodeURIComponent(c)}`);
      const text = await res.text();

      if (!res.ok) {
        throw new Error(text || `匯率讀取失敗 (${res.status})`);
      }

      const data = JSON.parse(text);
      const rate = Number(data?.rate);

      if (!Number.isFinite(rate) || rate <= 0) {
        throw new Error(`無法取得 ${c} 匯率`);
      }

      return rate;
    }

    const rateCache = new Map();

    async function getRateToTWD(currency) {
      const c = String(currency || "TWD").toUpperCase();
      if (rateCache.has(c)) return rateCache.get(c);

      const rate = await fetchRateToTWD(c);
      rateCache.set(c, rate);
      return rate;
    }

    async function convertTxToDisplayAmount(tx, targetCurrency) {
      const target = String(targetCurrency || "TWD").toUpperCase();
      const txCurrency = String(tx.currency || "TWD").toUpperCase();
      const rawAmount = Number(tx.amount || 0);
      const amountTWD = Number(tx.amountTWD || rawAmount || 0);

      if (target === "TWD") return amountTWD;
      if (txCurrency === target && rawAmount > 0) return rawAmount;

      const targetRateToTWD = await getRateToTWD(target);
      return amountTWD / targetRateToTWD;
    }

    function txInCurrentRange(tx) {
      const date = String(tx.date || "");
      if (!date) return false;

      if (currentPeriod === "year") {
        return date.startsWith(`${currentMonth.getFullYear()}-`);
      }

      return date.startsWith(monthKeyFromDate(currentMonth));
    }

    async function prepareStatsTxs(txs, kind, targetCurrency) {
      const filtered = txs.filter((tx) => {
        if (!txInCurrentRange(tx)) return false;
        if (isTransferTx(tx)) return false;
        return String(tx.type || "expense") === kind;
      });

      return Promise.all(
        filtered.map(async (tx) => ({
          ...tx,
          __displayAmount: await convertTxToDisplayAmount(tx, targetCurrency),
        }))
      );
    }

    async function renderCategoryChart(kind, txs) {
      const preparedTxs = await prepareStatsTxs(Array.isArray(txs) ? txs : [], kind, displayCurrency);
      const sumsByCat = new Map();

      for (const tx of preparedTxs) {
        const shownAmount = Number(tx.__displayAmount || 0);
        if (!Number.isFinite(shownAmount) || shownAmount <= 0) continue;

        const cat = (tx.category || "Uncategorized").trim() || "Uncategorized";
        sumsByCat.set(cat, (sumsByCat.get(cat) || 0) + shownAmount);
      }

      const items = Array.from(sumsByCat.entries())
        .map(([name, value]) => ({ name, value }))
        .sort((a, b) => b.value - a.value);

      const root = $("chartRoot");
      const card = $("chartCard");
      root.innerHTML = "";

      if (items.length === 0) {
        card.classList.add("card--empty");
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent =
          currentPeriod === "year"
            ? (kind === "income"
                ? "這一年還沒有收入資料，先去新增幾筆吧！"
                : "這一年還沒有支出資料，先去新增幾筆吧！")
            : (kind === "income"
                ? "這個月份還沒有收入資料，先去新增幾筆吧！"
                : "這個月份還沒有支出資料，先去新增幾筆吧！");
        root.appendChild(empty);
        finishFirstPaint();
        return;
      }

      card.classList.remove("card--empty");

      const total = items.reduce((s, x) => s + x.value, 0);

      const MAX = 8;
      const main = items.slice(0, MAX);
      const rest = items.slice(MAX);
      if (rest.length) {
        main.push({
          name: "Other",
          value: rest.reduce((s, x) => s + x.value, 0)
        });
      }

      const palette = kind === "income" ? incomePalette : expensePalette;

      const slices = main.map((x, i) => ({
        ...x,
        color: palette[i % palette.length],
        pct: x.value / total,
      }));

      const donutArea = document.createElement("div");
      donutArea.className = "donut-area";
      donutArea.appendChild(
        buildDonutSVG(
          total,
          slices,
          currentPeriod === "year"
            ? (kind === "income" ? "Year Income" : "Year Expenses")
            : (kind === "income" ? "Month Income" : "Month Expenses"),
          formatMoney(displayCurrency, total)
        )
      );

      const legend = document.createElement("div");
      legend.className = "donut-legend";

      for (const s of slices) {
        const row = document.createElement("div");
        row.className = "legend-row";

        const left = document.createElement("div");
        left.className = "legend-left";

        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.background = s.color;

        const cat = document.createElement("div");
        cat.className = "cat";
        cat.textContent = s.name;

        left.append(dot, cat);

        const pct = document.createElement("div");
        pct.className = "pct";
        pct.textContent = Math.round(clamp01(s.pct) * 100) + "%";

        const amt = document.createElement("div");
        amt.className = "amt";
        amt.textContent = formatMoney(displayCurrency, s.value);

        row.append(left, pct, amt);
        legend.appendChild(row);
      }

      root.append(donutArea, legend);
      finishFirstPaint();
    }

    async function renderCurrentStatsMode() {
      await renderCategoryChart(currentMode, latestStatsTxs);
    }

    window.__setStatsTxs = async (txs) => {
      latestStatsTxs = Array.isArray(txs) ? txs : [];
      await renderCurrentStatsMode();
    };

    window.__renderCurrentStatsMode = renderCurrentStatsMode;
    window.__reloadStatsRange = async () => {
      updateRangeLabel();
      await window.__watchStatsForCurrentRange?.();
    };
  </script>

  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      collection,
      query,
      where,
      orderBy,
      onSnapshot,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { db } from "./firebase-config.js";

    function monthStartKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}-01`;
    }

    function nextMonthStartKey(dateObj) {
      const next = new Date(dateObj.getFullYear(), dateObj.getMonth() + 1, 1);
      const y = next.getFullYear();
      const m = String(next.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}-01`;
    }

    function yearStartKey(dateObj) {
      return `${dateObj.getFullYear()}-01-01`;
    }

    function nextYearStartKey(dateObj) {
      return `${dateObj.getFullYear() + 1}-01-01`;
    }

    async function loadBookSettings(uid, bookId) {
      if (!bookId) {
        window.__applyBookCurrencySettings?.({});
        return;
      }

      try {
        let data = window.dataUtils?.getCachedBook(uid, bookId);

        if (!data) {
          const ref = doc(db, "users", uid, "books", bookId);
          const snap = await getDoc(ref);
          data = snap.exists() ? (snap.data() || {}) : {};
          window.dataUtils?.setCachedBook(uid, bookId, data);
        }

        window.__applyBookCurrencySettings?.(data.settings || {});
      } catch (e) {
        console.error("讀取帳本設定失敗:", e);
        window.__applyBookCurrencySettings?.({});
      }
    }

    async function renderCurrentBookBadge(uid) {
      const badge = document.getElementById("bookBadge");
      const bookId = localStorage.getItem("wis_currentBookId") || "";

      if (!bookId) {
        badge.style.display = "none";
        window.__applyBookCurrencySettings?.({});
        return;
      }

      try {
        let data = window.dataUtils?.getCachedBook(uid, bookId);

        if (!data) {
          const ref = doc(db, "users", uid, "books", bookId);
          const snap = await getDoc(ref);
          data = snap.exists() ? (snap.data() || {}) : {};
          window.dataUtils?.setCachedBook(uid, bookId, data);
        }

        badge.textContent = (data.name || "未命名帳本").trim();
        badge.title = badge.textContent;
        badge.style.display = "inline-flex";

        window.__applyBookCurrencySettings?.(data.settings || {});
      } catch (e) {
        console.error("讀取帳本 badge 失敗:", e);
        badge.style.display = "none";
        await loadBookSettings(uid, bookId);
      }
    }

    let unsubscribeStats = null;
    let currentWatchKey = "";

    function stopWatchingStats() {
      if (unsubscribeStats) {
        unsubscribeStats();
        unsubscribeStats = null;
      }
      currentWatchKey = "";
    }

    function getCurrentRangeQuery(currentPeriod, currentMonth, txRef, bookId) {
      if (currentPeriod === "year") {
        const start = yearStartKey(currentMonth);
        const end = nextYearStartKey(currentMonth);

        return query(
          txRef,
          where("bookId", "==", bookId),
          where("date", ">=", start),
          where("date", "<", end),
          orderBy("date", "desc"),
          orderBy("time", "desc")
        );
      }

      const start = monthStartKey(currentMonth);
      const end = nextMonthStartKey(currentMonth);

      return query(
        txRef,
        where("bookId", "==", bookId),
        where("date", ">=", start),
        where("date", "<", end),
        orderBy("date", "desc"),
        orderBy("time", "desc")
      );
    }

    function watchStats(uid, currentPeriod, currentMonth, bookId) {
      if (!bookId) {
        stopWatchingStats();
        window.__setStatsTxs([]);
        return;
      }

      const periodKey =
        currentPeriod === "year"
          ? `${currentMonth.getFullYear()}`
          : `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, "0")}`;

      const watchKey = `${uid}__${bookId}__${currentPeriod}__${periodKey}`;
      if (unsubscribeStats && currentWatchKey === watchKey) return;

      stopWatchingStats();

      const txRef = collection(db, "users", uid, "transactions");
      const q = getCurrentRangeQuery(currentPeriod, currentMonth, txRef, bookId);

      currentWatchKey = watchKey;

      unsubscribeStats = onSnapshot(
        q,
        async (snap) => {
          const txs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          await window.__setStatsTxs(txs);
        },
        async (e) => {
          console.error("統計頁即時監聽失敗:", e);
          await window.__setStatsTxs([]);
        }
      );
    }

    window.__watchStatsForCurrentRange = async () => {
      const user = window.auth.currentUser;
      if (!user) return;

      const bookId = localStorage.getItem("wis_currentBookId") || "";
      const currentPeriod = localStorage.getItem("wis_stats_period") || "month";
      const label = document.getElementById("monthLabel")?.textContent || "";

      let currentMonth;
      if (currentPeriod === "year") {
        const y = parseInt(label, 10) || new Date().getFullYear();
        currentMonth = new Date(y, 0, 1);
      } else {
        const m = /^\d{4}-\d{2}$/.test(label) ? label : null;
        if (m) {
          const [yy, mm] = m.split("-").map(Number);
          currentMonth = new Date(yy, mm - 1, 1);
        } else {
          currentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
        }
      }

      watchStats(user.uid, currentPeriod, currentMonth, bookId);
    };

    function resumeWatchIfNeeded() {
      window.__watchStatsForCurrentRange?.();
    }

    await window.firebaseReady;

    onAuthStateChanged(window.auth, async (user) => {
      if (!user) {
        stopWatchingStats();
        window.pageLoader?.hide();
        const next = encodeURIComponent(location.href);
        location.replace(`login.html?next=${next}`);
        return;
      }

      try {
        await window.ensureDefaultBookAndCategories(user.uid);
        await renderCurrentBookBadge(user.uid);
        await window.__watchStatsForCurrentRange?.();
      } catch (e) {
        console.error("統計頁初始化失敗:", e);
        await window.__setStatsTxs([]);
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        resumeWatchIfNeeded();
      }
    });

    window.addEventListener("focus", () => {
      resumeWatchIfNeeded();
    });

    window.addEventListener("pageshow", () => {
      resumeWatchIfNeeded();
    });

    window.addEventListener("beforeunload", () => {
      stopWatchingStats();
    });
  </script>
</body>
</html>
