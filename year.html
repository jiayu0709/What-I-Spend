<!doctype html>
<html lang="zh-Hant">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="theme.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="What I Spend">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>分析</title>

  <style>
    .monthbar{
      margin-top:6px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .monthbar .m-btn{
      border:0;
      background: transparent;
      padding:10px 12px;
      border-radius:12px;
      font-weight:900;
      color: var(--accent-text, var(--accent));
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
    }

    .monthbar .m-title{
      font-weight:900;
      letter-spacing:-.2px;
      color: var(--text);
      white-space:nowrap;
    }

    .card.card--empty{
      background:transparent;
      padding:0;
    }

    .seg{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-bottom:12px;
      padding:4px;
      border-radius:12px;
      background:rgba(255,255,255,0.45);
      border:1px solid rgba(0,0,0,0.06);
    }

    .seg-btn{
      border:0;
      background:transparent;
      border-radius:10px;
      padding:10px 0;
      font-size:15px;
      font-weight:800;
      color:var(--secondary);
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      -webkit-user-select:none;
      transition:all .15s ease;
    }

    .seg-btn.active{
      background:var(--accent-text);
      color:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .donut-wrap{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
      align-items:center;
    }

    .donut-area{
      display:grid;
      place-items:center;
      padding:8px 0 2px;
    }

    .donut-legend{
      margin-top:6px;
      display:grid;
      gap:12px;
    }

    .legend-row{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:10px;
      align-items:center;
      font-size:18px;
      padding:8px 0;
    }

    .legend-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:999px;
      flex:0 0 auto;
    }

    .cat{
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .pct{
      color:var(--secondary);
      font-weight:900;
      width:56px;
      text-align:right;
    }

    .amt{
      font-weight:900;
      width:120px;
      text-align:right;
    }

    .donut-svg{
      width:260px;
      height:260px;
      display:block;
    }

    .center-title{
      font-size:18px;
      font-weight:900;
      fill:var(--secondary);
    }

    .center-value{
      font-size:26px;
      font-weight:900;
      fill:var(--text);
    }

    .hidden{
      display:none !important;
    }
  </style>
</head>

<body>
  <div class="app">
    <main class="page">
      <div class="nav">
        <div class="nav-left"></div>
        <div class="nav-title">統計</div>
        <div class="nav-right">
          <div class="book-badge" id="bookBadge" style="display:none;"></div>
        </div>
      </div>

      <div class="monthbar" aria-label="月份切換">
        <button class="m-btn" type="button" id="btnPrev" aria-label="上一月">&lt;</button>
        <div class="m-title"><span id="monthLabel">Loading...</span></div>
        <button class="m-btn" type="button" id="btnNext" aria-label="下一月">&gt;</button>
      </div>

      <section class="section">
        <div class="seg" aria-label="統計類型切換">
          <button class="seg-btn active" type="button" id="btnExpense">支出</button>
          <button class="seg-btn" type="button" id="btnIncome">收入</button>
        </div>

        <div class="seg" aria-label="顯示幣別切換">
          <button class="seg-btn active" type="button" id="btnCurTWD">TWD</button>
          <button class="seg-btn hidden" type="button" id="btnCurForeign">USD</button>
        </div>

        <div class="card" id="chartCard">
          <div id="chartRoot" class="donut-wrap"></div>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Tab Bar">
      <div class="tabbar-inner">
        <button class="tab" type="button" data-href="add.html"><div class="icon">＋</div><div>新增</div></button>
        <button class="tab" type="button" data-href="month.html"><div class="icon">▦</div><div>本月</div></button>
        <button class="tab" type="button" data-href="year.html"><div class="icon">⛁</div><div>統計</div></button>
      </div>
    </nav>
  </div>

  <script type="module" src="app.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");

    const monthKeyFromDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;

    const parseMonthKey = (key) => {
      if (!key || !/^\d{4}-\d{2}$/.test(key)) return null;
      const [y, m] = key.split("-").map((n) => parseInt(n, 10));
      if (!y || !m || m < 1 || m > 12) return null;
      return new Date(y, m - 1, 1);
    };

    const addMonths = (dateObj, delta) =>
      new Date(dateObj.getFullYear(), dateObj.getMonth() + delta, 1);

    const monthLabel = (dateObj) =>
      `${dateObj.getFullYear()}-${pad2(dateObj.getMonth() + 1)}`;

    const clamp01 = (x) => Math.max(0, Math.min(1, x));

    const qs = new URLSearchParams(location.search);
    let currentMonth =
      parseMonthKey(qs.get("m")) ||
      new Date(new Date().getFullYear(), new Date().getMonth(), 1);

    const currentKey = monthKeyFromDate(currentMonth);

    const LS_BOOK = "wis_currentBookId";
    const LS_STATS_MODE = "wis_stats_mode";
    const LS_STATS_DISPLAY_CURRENCY = "wis_stats_display_currency";

    const urlBook = qs.get("b");
    if (urlBook) localStorage.setItem(LS_BOOK, urlBook);

    let currentMode = localStorage.getItem(LS_STATS_MODE) || "expense";
    let displayCurrency = localStorage.getItem(LS_STATS_DISPLAY_CURRENCY) || "TWD";
    let foreignCurrency = "";
    let availableCurrencies = ["TWD"];

    $("monthLabel").textContent = monthLabel(currentMonth);

    function getAvailableCurrencies() {
      const list = ["TWD"];
      if (foreignCurrency && foreignCurrency !== "TWD") list.push(foreignCurrency);
      return list;
    }

    function normalizeDisplayCurrency(next) {
      const wanted = String(next || "TWD").toUpperCase();
      return availableCurrencies.includes(wanted) ? wanted : "TWD";
    }

    function formatMoney(currency, amount) {
      const n = Number(amount || 0);

      if (currency === "TWD") {
        return "NT$" + Math.round(n).toLocaleString("en-US");
      }

      if (currency === "USD") {
        return "US$" + n.toLocaleString("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2,
        });
      }

      if (currency === "EUR") {
        return "€" + n.toLocaleString("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2,
        });
      }

      return `${currency} ${n.toLocaleString("en-US", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2,
      })}`;
    }

    function updateSegUI() {
      $("btnExpense").classList.toggle("active", currentMode === "expense");
      $("btnIncome").classList.toggle("active", currentMode === "income");
    }

    function updateCurrencyUI() {
      const btnTWD = $("btnCurTWD");
      const btnForeign = $("btnCurForeign");

      btnTWD.classList.toggle("active", displayCurrency === "TWD");

      if (foreignCurrency && foreignCurrency !== "TWD") {
        btnForeign.classList.remove("hidden");
        btnForeign.textContent = foreignCurrency;
        btnForeign.classList.toggle("active", displayCurrency === foreignCurrency);
      } else {
        btnForeign.classList.add("hidden");
        btnForeign.classList.remove("active");
      }
    }

    function applyDisplayCurrency(next) {
      displayCurrency = normalizeDisplayCurrency(next);
      localStorage.setItem(LS_STATS_DISPLAY_CURRENCY, displayCurrency);
      updateCurrencyUI();
    }

    function applyBookCurrencySettings(settings = {}) {
      foreignCurrency = String(settings.foreignCurrency || "").toUpperCase();
      if (!["USD", "EUR"].includes(foreignCurrency)) {
        foreignCurrency = "";
      }

      availableCurrencies = getAvailableCurrencies();

      const saved = localStorage.getItem(LS_STATS_DISPLAY_CURRENCY) || "";
      const preferred = String(settings.primaryDisplayCurrency || "TWD").toUpperCase();
      const nextDisplay = normalizeDisplayCurrency(saved || preferred || "TWD");

      applyDisplayCurrency(nextDisplay);
    }

    window.__applyBookCurrencySettings = applyBookCurrencySettings;

    $("btnExpense").addEventListener("click", async () => {
      currentMode = "expense";
      localStorage.setItem(LS_STATS_MODE, currentMode);
      updateSegUI();
      await window.__renderCurrentStatsMode();
    });

    $("btnIncome").addEventListener("click", async () => {
      currentMode = "income";
      localStorage.setItem(LS_STATS_MODE, currentMode);
      updateSegUI();
      await window.__renderCurrentStatsMode();
    });

    $("btnCurTWD").addEventListener("click", async () => {
      applyDisplayCurrency("TWD");
      await window.__renderCurrentStatsMode();
    });

    $("btnCurForeign").addEventListener("click", async () => {
      if (!foreignCurrency) return;
      applyDisplayCurrency(foreignCurrency);
      await window.__renderCurrentStatsMode();
    });

    $("btnPrev").addEventListener("click", () => {
      const prev = addMonths(currentMonth, -1);
      const m = monthKeyFromDate(prev);
      const bookId = localStorage.getItem(LS_BOOK) || "";
      location.href = `year.html?m=${m}` + (bookId ? `&b=${encodeURIComponent(bookId)}` : "");
    });

    $("btnNext").addEventListener("click", () => {
      const next = addMonths(currentMonth, 1);
      const m = monthKeyFromDate(next);
      const bookId = localStorage.getItem(LS_BOOK) || "";
      location.href = `year.html?m=${m}` + (bookId ? `&b=${encodeURIComponent(bookId)}` : "");
    });

    updateSegUI();
    updateCurrencyUI();

    const getTxIndex = () => {
      try {
        const raw = localStorage.getItem("tx:index");
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    };

    const readTx = (id) => {
      const raw = localStorage.getItem("tx:" + id);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    };

    const isDeleted = (id) => localStorage.getItem("tx:deleted:" + id) === "1";

    const polarToCartesian = (cx, cy, r, angleDeg) => {
      const rad = ((angleDeg - 90) * Math.PI) / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    };

    const describeArc = (cx, cy, r, startAngle, endAngle) => {
      const start = polarToCartesian(cx, cy, r, endAngle);
      const end = polarToCartesian(cx, cy, r, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      return ["M", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y].join(" ");
    };

    const expensePalette = [
      "#D97B66", "#C98BB9", "#8FA7D6", "#7FC8C2", "#9BCB8F",
      "#E7B56A", "#C6A0E1", "#E38A8A", "#7FB7A3", "#A89F91",
    ];

    const incomePalette = [
      "#69B578", "#6CC3A0", "#7EC8E3", "#8FA7D6", "#A7D49B",
      "#F0C36E", "#B8A1E3", "#73C0AE", "#9FD3C7", "#B7C9F2",
    ];

    function buildDonutSVG(total, slices, centerTitle, centerValueText) {
      const size = 260;
      const cx = size / 2;
      const cy = size / 2;
      const r = 92;
      const stroke = 34;

      let start = 0;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
      svg.setAttribute("class", "donut-svg");

      const bg = document.createElementNS(svg.namespaceURI, "circle");
      bg.setAttribute("cx", cx);
      bg.setAttribute("cy", cy);
      bg.setAttribute("r", r);
      bg.setAttribute("fill", "none");
      bg.setAttribute("stroke", "rgba(0,0,0,0.06)");
      bg.setAttribute("stroke-width", stroke);
      svg.appendChild(bg);

      for (const s of slices) {
        const ratio = total > 0 ? s.value / total : 0;
        const sweep = 360 * ratio;
        const end = start + sweep;

        if (ratio >= 0.999999) {
          const circle = document.createElementNS(svg.namespaceURI, "circle");
          circle.setAttribute("cx", cx);
          circle.setAttribute("cy", cy);
          circle.setAttribute("r", r);
          circle.setAttribute("fill", "none");
          circle.setAttribute("stroke", s.color);
          circle.setAttribute("stroke-width", stroke);
          svg.appendChild(circle);
          start = end;
          continue;
        }

        const path = document.createElementNS(svg.namespaceURI, "path");
        path.setAttribute("d", describeArc(cx, cy, r, start, end));
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", s.color);
        path.setAttribute("stroke-width", stroke);
        path.setAttribute("stroke-linecap", "butt");
        svg.appendChild(path);

        start = end;
      }

      const t1 = document.createElementNS(svg.namespaceURI, "text");
      t1.setAttribute("x", cx);
      t1.setAttribute("y", cy - 4);
      t1.setAttribute("text-anchor", "middle");
      t1.setAttribute("class", "center-title");
      t1.textContent = centerTitle;
      svg.appendChild(t1);

      const t2 = document.createElementNS(svg.namespaceURI, "text");
      t2.setAttribute("x", cx);
      t2.setAttribute("y", cy + 26);
      t2.setAttribute("text-anchor", "middle");
      t2.setAttribute("class", "center-value");
      t2.textContent = centerValueText;
      svg.appendChild(t2);

      return svg;
    }

    function getSourceTxs(txs) {
      if (Array.isArray(txs)) return txs;

      const ids = getTxIndex().filter(Boolean);
      const tmp = [];
      for (const id of ids) {
        if (isDeleted(id)) continue;
        const tx = readTx(id);
        if (tx) tmp.push(tx);
      }
      return tmp;
    }

    async function fetchRateToTWD(currency) {
      const c = String(currency || "TWD").toUpperCase();
      if (c === "TWD") return 1;

      const res = await fetch(`/.netlify/functions/getFxRate?currency=${encodeURIComponent(c)}`);
      const text = await res.text();

      if (!res.ok) {
        throw new Error(text || `匯率讀取失敗 (${res.status})`);
      }

      const data = JSON.parse(text);
      const rate = Number(data?.rate);

      if (!Number.isFinite(rate) || rate <= 0) {
        throw new Error(`無法取得 ${c} 匯率`);
      }

      return rate;
    }

    const rateCache = new Map();

    async function getRateToTWD(currency) {
      const c = String(currency || "TWD").toUpperCase();
      if (rateCache.has(c)) return rateCache.get(c);

      const rate = await fetchRateToTWD(c);
      rateCache.set(c, rate);
      return rate;
    }

    async function convertTxToDisplayAmount(tx, targetCurrency) {
      const target = String(targetCurrency || "TWD").toUpperCase();
      const txCurrency = String(tx.currency || "TWD").toUpperCase();
      const rawAmount = Number(tx.amount || 0);
      const amountTWD = Number(tx.amountTWD || rawAmount || 0);

      if (target === "TWD") {
        return amountTWD;
      }

      if (txCurrency === target && rawAmount > 0) {
        return rawAmount;
      }

      const targetRateToTWD = await getRateToTWD(target);
      return amountTWD / targetRateToTWD;
    }

    async function renderCategoryChart(kind, txs) {
      const sumsByCat = new Map();
      const sourceTxs = getSourceTxs(txs);

      for (const tx of sourceTxs) {
        const date = String(tx.date || "");
        if (!date.startsWith(currentKey)) continue;
        if (String(tx.type || "expense") !== kind) continue;

        const shownAmount = await convertTxToDisplayAmount(tx, displayCurrency);
        if (!Number.isFinite(shownAmount) || shownAmount <= 0) continue;

        const cat = (tx.category || "Uncategorized").trim() || "Uncategorized";
        sumsByCat.set(cat, (sumsByCat.get(cat) || 0) + shownAmount);
      }

      const items = Array.from(sumsByCat.entries())
        .map(([name, value]) => ({ name, value }))
        .sort((a, b) => b.value - a.value);

      const root = $("chartRoot");
      const card = $("chartCard");
      root.innerHTML = "";

      if (items.length === 0) {
        card.classList.add("card--empty");
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = kind === "income"
          ? "這個月份還沒有收入資料，先去新增幾筆吧！"
          : "這個月份還沒有支出資料，先去新增幾筆吧！";
        root.appendChild(empty);
        return;
      }

      card.classList.remove("card--empty");

      const total = items.reduce((s, x) => s + x.value, 0);

      const MAX = 8;
      const main = items.slice(0, MAX);
      const rest = items.slice(MAX);
      if (rest.length) {
        main.push({
          name: "Other",
          value: rest.reduce((s, x) => s + x.value, 0)
        });
      }

      const palette = kind === "income" ? incomePalette : expensePalette;

      const slices = main.map((x, i) => ({
        ...x,
        color: palette[i % palette.length],
        pct: x.value / total,
      }));

      const donutArea = document.createElement("div");
      donutArea.className = "donut-area";
      donutArea.appendChild(
        buildDonutSVG(
          total,
          slices,
          kind === "income" ? "Income" : "Expenses",
          formatMoney(displayCurrency, total)
        )
      );

      const legend = document.createElement("div");
      legend.className = "donut-legend";

      for (const s of slices) {
        const row = document.createElement("div");
        row.className = "legend-row";

        const left = document.createElement("div");
        left.className = "legend-left";

        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.background = s.color;

        const cat = document.createElement("div");
        cat.className = "cat";
        cat.textContent = s.name;

        left.append(dot, cat);

        const pct = document.createElement("div");
        pct.className = "pct";
        pct.textContent = Math.round(clamp01(s.pct) * 100) + "%";

        const amt = document.createElement("div");
        amt.className = "amt";
        amt.textContent = formatMoney(displayCurrency, s.value);

        row.append(left, pct, amt);
        legend.appendChild(row);
      }

      root.append(donutArea, legend);
    }

    let latestStatsTxs = null;

    async function renderCurrentStatsMode() {
      await renderCategoryChart(currentMode, latestStatsTxs);
    }

    window.__setStatsTxs = async (txs) => {
      latestStatsTxs = Array.isArray(txs) ? txs : null;
      await renderCurrentStatsMode();
    };

    window.__renderCurrentStatsMode = renderCurrentStatsMode;
    window.__currentKeyForStats = currentKey;
  </script>

  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, query, where, orderBy, onSnapshot, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { db } from "./firebase-config.js";

    function nextMonthKey(ym){
      const [y, m] = ym.split("-").map(n => parseInt(n, 10));
      const d = new Date(y, m - 1, 1);
      const next = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      const mm = String(next.getMonth() + 1).padStart(2, "0");
      return `${next.getFullYear()}-${mm}`;
    }

    async function loadBookSettings(uid, bookId) {
      if (!bookId) {
        window.__applyBookCurrencySettings?.({});
        return;
      }

      try {
        const ref = doc(db, "users", uid, "books", bookId);
        const snap = await getDoc(ref);
        const data = snap.data() || {};
        const settings = data.settings || {};
        window.__applyBookCurrencySettings?.(settings);
      } catch (e) {
        console.error("讀取帳本設定失敗:", e);
        window.__applyBookCurrencySettings?.({});
      }
    }

    async function renderCurrentBookBadge(uid) {
      const badge = document.getElementById("bookBadge");
      const bookId = localStorage.getItem("wis_currentBookId") || "";

      if (!bookId) {
        badge.style.display = "none";
        window.__applyBookCurrencySettings?.({});
        return;
      }

      try {
        const booksRef = collection(db, "users", uid, "books");
        const q1 = query(booksRef, orderBy("createdAt", "asc"));
        const snap = await getDocs(q1);
        const books = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const current = books.find(b => b.id === bookId);

        badge.textContent = (current?.name || "未命名帳本").trim();
        badge.title = badge.textContent;
        badge.style.display = "inline-flex";

        const settings = current?.settings || {};
        window.__applyBookCurrencySettings?.(settings);
      } catch (e) {
        console.error("讀取帳本 badge 失敗:", e);
        badge.style.display = "none";
        await loadBookSettings(uid, bookId);
      }
    }

    let unsubscribeStats = null;
    let currentWatchKey = "";

    function stopWatchingStats() {
      if (unsubscribeStats) {
        unsubscribeStats();
        unsubscribeStats = null;
      }
      currentWatchKey = "";
    }

    function watchMonthTxs(uid, ym, bookId) {
      if (!bookId) {
        stopWatchingStats();
        window.__setStatsTxs(null);
        return;
      }

      const watchKey = `${uid}__${bookId}__${ym}`;
      if (unsubscribeStats && currentWatchKey === watchKey) return;

      stopWatchingStats();

      const start = `${ym}-01`;
      const end = `${nextMonthKey(ym)}-01`;

      const txRef = collection(db, "users", uid, "transactions");
      const q = query(
        txRef,
        where("bookId", "==", bookId),
        where("date", ">=", start),
        where("date", "<", end),
        orderBy("date", "desc"),
        orderBy("time", "desc")
      );

      currentWatchKey = watchKey;

      unsubscribeStats = onSnapshot(
        q,
        async (snap) => {
          const txs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          await window.__setStatsTxs(txs);
        },
        (e) => {
          console.error("統計頁即時監聽失敗（fallback localStorage）:", e);
          window.__setStatsTxs(null);
        }
      );
    }

    function resumeWatchIfNeeded() {
      const user = window.auth.currentUser;
      if (!user) return;

      const ym = window.__currentKeyForStats;
      const bookId = localStorage.getItem("wis_currentBookId") || "";
      watchMonthTxs(user.uid, ym, bookId);
    }

    await window.firebaseReady;

    onAuthStateChanged(window.auth, async (user) => {
      if (!user) {
        stopWatchingStats();
        const next = encodeURIComponent(location.href);
        location.replace(`login.html?next=${next}`);
        return;
      }

      try {
        await window.ensureDefaultBookAndCategories(user.uid);
        await renderCurrentBookBadge(user.uid);

        const ym = window.__currentKeyForStats;
        const bookId = localStorage.getItem("wis_currentBookId") || "";

        watchMonthTxs(user.uid, ym, bookId);
      } catch (e) {
        console.error("統計頁初始化失敗（fallback localStorage）:", e);
        window.__setStatsTxs(null);
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        resumeWatchIfNeeded();
      }
    });

    window.addEventListener("focus", () => {
      resumeWatchIfNeeded();
    });

    window.addEventListener("pageshow", () => {
      resumeWatchIfNeeded();
    });

    window.addEventListener("beforeunload", () => {
      stopWatchingStats();
    });
  </script>
</body>
</html>
