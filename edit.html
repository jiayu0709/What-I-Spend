<!doctype html>
<!--
  edit.html
  ✅ 分類抓這筆交易所屬帳本 books/{bookId}.categories
  ✅ 幣別選項 = TWD + 該帳本 settings.foreignCurrency
  ✅ 編輯預設幣別 = 這筆交易原本存的 currency
  ✅ 若原分類已不在帳本分類內，仍保留顯示
  ✅ 若原幣別已不在帳本可用幣別內，仍保留顯示
  ✅ 金額區塊排版比照 add.html
  ✅ 刪除完成後自動返回 ref
-->
<html lang="zh-Hant">
<head>
  <link rel="stylesheet" href="theme.css">
  <meta name="page" content="edit">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>編輯明細</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    }

    .app{min-height:100vh;padding-bottom:18px}
    .page{max-width:520px;margin:0 auto;padding:18px var(--page-padding) 28px}

    .card{background:var(--card-bg);border-radius:var(--radius);padding:16px}
    .field{display:grid;gap:8px;margin-top:14px;min-width:0}
    .field:first-child{margin-top:0}
    .label{font-size:14px;font-weight:900;color:var(--secondary)}

    .dual-field-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:14px;
      min-width:0;
      align-items:start;
    }

    .dual-field{
      display:grid;
      grid-template-rows:auto 52px;
      gap:8px;
      min-width:0;
    }

    .dual-field .label{
      margin:0;
      line-height:1.2;
    }

    .dual-field .input,
    .dual-field select{
      margin:0;
    }

    .input,
    input,
    select{
      width:100%;
      max-width:100%;
      box-sizing:border-box;
      height:52px;
      padding:0 12px;
      border-radius:10px;
      border:1px solid rgba(0,0,0,0.12);
      background:#fff;
      font-size:16px;
      line-height:52px;
    }

    input[type="date"],
    input[type="time"],
    select{
      display:block;
      appearance:none;
      -webkit-appearance:none;
    }

    select{
      line-height:normal;
      padding-top:0;
      padding-bottom:0;
      text-align:center;
      text-align-last:center;
      padding-left:12px;
      padding-right:12px;
    }
    select option{ text-align:center; }

    .input,
    input,
    select{
      text-align:center;
      color:var(--accent-text);
      -webkit-text-fill-color:var(--accent-text);
    }

    input[type="date"]::-webkit-datetime-edit,
    input[type="time"]::-webkit-datetime-edit{
      text-align:center;
      color:var(--accent-text);
      -webkit-text-fill-color:var(--accent-text);
    }
    input[type="date"]::-webkit-datetime-edit-text,
    input[type="date"]::-webkit-datetime-edit-month-field,
    input[type="date"]::-webkit-datetime-edit-day-field,
    input[type="date"]::-webkit-datetime-edit-year-field,
    input[type="time"]::-webkit-datetime-edit-text,
    input[type="time"]::-webkit-datetime-edit-hour-field,
    input[type="time"]::-webkit-datetime-edit-minute-field,
    input[type="time"]::-webkit-datetime-edit-ampm-field{
      color:var(--accent-text);
      -webkit-text-fill-color:var(--accent-text);
    }
    select option{ color:var(--accent-text); }

    .amount-card{
      display:grid;
      gap:12px;
      padding:14px;
      border-radius:16px;
      background:rgba(255,255,255,0.56);
      border:1px solid rgba(0,0,0,0.06);
    }

    .amount-main{
      display:grid;
      grid-template-columns:110px 1fr;
      gap:12px;
      align-items:center;
      min-height:56px;
    }

    .currency-pill{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.08);
      font-weight:900;
      font-size:18px;
      color:var(--text);
    }

    .amount-input{
      width:100%;
      height:56px;
      border:0;
      background:transparent;
      outline:none;
      font-size:34px;
      line-height:56px;
      font-weight:900;
      color:var(--text);
      padding:0;
      margin:0;
      min-width:0;
      text-align:left;
      -webkit-text-fill-color:var(--text);
    }

    .amount-input::placeholder{
      color:#b4b4b4;
      font-weight:800;
    }

    .fx-wrap{
      display:grid;
      gap:10px;
      padding-top:2px;
    }

    .fx-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .preview-box{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:12px;
      min-height:52px;
      border-radius:12px;
      background:rgba(255,255,255,0.72);
      border:1px solid rgba(0,0,0,0.06);
    }

    .preview-value{
      font-size:18px;
      font-weight:900;
      color:var(--text);
      white-space:nowrap;
    }

    .hidden{
      display:none !important;
    }

    .btnbar{margin-top:14px;display:grid;gap:10px}

    .btn{
      width:100%;
      padding:14px 16px;
      border:0;
      outline:0;
      border-radius:var(--radius);
      background:var(--btn-secondary-bg, var(--card-bg));
      color:var(--btn-secondary-text, var(--accent-text));
      font-size:18px;
      font-weight:900;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
    }

    .btn.primary{
      background:var(--btn-primary-bg, var(--accent-text));
      color:var(--btn-primary-text, #fff);
    }

    .btn:active{opacity:.7;transform:scale(.98)}

    a, button{ -webkit-tap-highlight-color:transparent; }
    .btn, .back{
      transition:background-color .15s ease, opacity .15s ease, transform .1s ease;
      user-select:none;
      -webkit-user-select:none;
    }

    .back:active{opacity:.6;transform:scale(.98)}
    .btn.primary:active{opacity:.75}

    @media (max-width:420px){
      .dual-field-row{
        grid-template-columns:1fr 1fr;
        gap:10px;
      }

      .dual-field .label{
        font-size:13px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <main class="page">
      <div class="nav">
        <div class="nav-left">
          <button class="back-btn" id="backLink" type="button">‹ 返回</button>
        </div>
        <div class="nav-title">編輯明細</div>
        <div class="nav-right">
          <div class="book-badge" id="bookBadge" style="display:none;"></div>
        </div>
      </div>

      <div class="card">
        <div class="field">
          <div class="label">日期</div>
          <input class="input" type="date" id="date" />
        </div>

        <div class="field">
          <div class="label">時間</div>
          <input class="input" type="time" id="time" />
        </div>

        <div class="dual-field-row">
          <div class="dual-field">
            <div class="label">分類</div>
            <select class="input" id="category"></select>
          </div>

          <div class="dual-field">
            <div class="label">幣別</div>
            <select class="input" id="currency"></select>
          </div>
        </div>

        <div class="field">
          <div class="label">金額</div>
          <div class="amount-card">
            <div class="amount-main">
              <div class="currency-pill" id="currencyPill">TWD</div>
              <input
                class="amount-input"
                type="number"
                id="amount"
                inputmode="decimal"
                placeholder="0"
              />
            </div>

            <div class="fx-wrap hidden" id="fxWrap">
              <div class="fx-row">
                <div class="field">
                  <div class="label">匯率</div>
                  <input
                    class="input"
                    type="number"
                    id="fxRate"
                    inputmode="decimal"
                    placeholder="1 外幣 = 幾 TWD"
                  />
                </div>

                <div class="field">
                  <div class="label">台幣金額</div>
                  <div class="preview-box">
                    <div class="preview-value" id="amountTWDPreview">NT$0</div>
                  </div>
                </div>
              </div>

              <div class="hint" id="fxHint">
                外幣會依匯率換算台幣。
              </div>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="label">備註</div>
          <input class="input" type="text" id="note" placeholder="（可空）" />
        </div>
      </div>

      <div class="btnbar">
        <button class="btn primary" id="saveBtn" type="button">儲存</button>
        <button class="btn" type="button" id="deleteBtn">刪除</button>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>

  <script type="module">
    import { doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { db } from "./firebase-config.js";

    window.saveToCloud = async (id, data) => {
      const user = await window.requireAuth();
      if (!user) throw new Error("Not logged in");

      const ref = doc(db, "users", user.uid, "transactions", id);
      await updateDoc(ref, {
        date: data.date,
        time: data.time,
        category: data.category,
        note: data.note,
        amount: data.amount,
        currency: data.currency,
        fxRateToTWD: data.fxRateToTWD,
        amountTWD: data.amountTWD,
      });
    };

    window.deleteFromCloud = async (id) => {
      const user = await window.requireAuth();
      if (!user) throw new Error("Not logged in");

      const ref = doc(db, "users", user.uid, "transactions", id);
      await deleteDoc(ref);
    };

    window.getTransactionFromCloud = async (id) => {
      const user = await window.requireAuth();
      if (!user) throw new Error("Not logged in");

      const ref = doc(db, "users", user.uid, "transactions", id);
      const snap = await getDoc(ref);
      return snap.exists() ? { id: snap.id, ...snap.data() } : null;
    };

    window.getBookDataFromCloud = async (bookId) => {
      const user = await window.requireAuth();
      if (!user) throw new Error("Not logged in");
      if (!bookId) throw new Error("No bookId");

      const ref = doc(db, "users", user.uid, "books", bookId);
      const snap = await getDoc(ref);
      return snap.exists() ? (snap.data() || {}) : {};
    };
  </script>

  <script>
    const qs = new URLSearchParams(location.search);
    const id = qs.get("id") || "tx-unknown";
    const ref = qs.get("ref") || "month.html";
    const txTypeFromQs = qs.get("type") || "expense";

    const DEFAULT_CATEGORIES = {
      expense: ["餐飲🥣","飲料🥤","交通🛵","日用🛍️","娛樂🎮","醫療🏥","治裝👗","家用🏠","旅遊🧳","其他🧶"],
      income: ["薪資💼","獎金🎁","兼職🧑‍💻","投資📈","退款💵","其他🧶"],
    };

    const els = {
      date: document.getElementById("date"),
      time: document.getElementById("time"),
      category: document.getElementById("category"),
      currency: document.getElementById("currency"),
      currencyPill: document.getElementById("currencyPill"),
      amount: document.getElementById("amount"),
      fxWrap: document.getElementById("fxWrap"),
      fxRate: document.getElementById("fxRate"),
      fxHint: document.getElementById("fxHint"),
      amountTWDPreview: document.getElementById("amountTWDPreview"),
      note: document.getElementById("note"),
      saveBtn: document.getElementById("saveBtn"),
      deleteBtn: document.getElementById("deleteBtn"),
      backLink: document.getElementById("backLink"),
    };

    let BOOK_DATA = {};
    let AVAILABLE_CURRENCIES = ["TWD"];
    let TX_DATA = null;
    let TX_TYPE = txTypeFromQs;

    function moneyNT(n){
      const v = Number(n || 0);
      return "NT$" + Math.round(v).toLocaleString("en-US");
    }

    function parseAmount(v){
      const n = Number(String(v ?? "").replace(/,/g, ""));
      return isFinite(n) ? n : NaN;
    }

    function normalizeCurrency(v){
      return String(v || "TWD").trim().toUpperCase();
    }

    function buildAvailableCurrencies(bookData = {}) {
      const list = ["TWD"];
      const foreign = normalizeCurrency(bookData?.settings?.foreignCurrency || "");

      if (foreign && foreign !== "TWD") {
        list.push(foreign);
      }

      return list;
    }

    if (els.backLink) {
      els.backLink.addEventListener("click", () => {
        location.href = ref;
      });
    }

    async function renderCategoryOptions(currentValue){
      const sel = els.category;
      if (!sel) return;

      const categories = BOOK_DATA.categories || {};
      const source =
        TX_TYPE === "income"
          ? (categories.income || DEFAULT_CATEGORIES.income)
          : (categories.expense || DEFAULT_CATEGORIES.expense);

      sel.innerHTML = "";

      for (const name of source) {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      }

      const cur = (currentValue || "").trim();

      if (cur && !source.includes(cur)) {
        const opt = document.createElement("option");
        opt.value = cur;
        opt.textContent = cur;
        sel.insertBefore(opt, sel.firstChild);
      }

      sel.value = cur || source[0] || "";
    }

    function renderCurrencyOptions(currentValue = ""){
      const sel = els.currency;
      if (!sel) return;

      sel.innerHTML = "";

      for (const c of AVAILABLE_CURRENCIES) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      }

      const cur = normalizeCurrency(currentValue || "TWD");

      if (cur && !AVAILABLE_CURRENCIES.includes(cur)) {
        const opt = document.createElement("option");
        opt.value = cur;
        opt.textContent = cur;
        sel.insertBefore(opt, sel.firstChild);
      }

      sel.value = cur || "TWD";
    }

    function updateTWDPreview() {
      const currency = normalizeCurrency(els.currency?.value || "TWD");
      const amount = parseAmount(els.amount?.value);
      const fxRate = parseAmount(els.fxRate?.value);

      if (!isFinite(amount) || amount <= 0) {
        els.amountTWDPreview.textContent = "NT$0";
        return;
      }

      if (currency === "TWD") {
        els.amountTWDPreview.textContent = moneyNT(amount);
        return;
      }

      if (!isFinite(fxRate) || fxRate <= 0) {
        els.amountTWDPreview.textContent = "NT$0";
        return;
      }

      els.amountTWDPreview.textContent = moneyNT(amount * fxRate);
    }

    function updateCurrencyUI() {
      const currency = normalizeCurrency(els.currency?.value || "TWD");
      els.currencyPill.textContent = currency;

      if (currency === "TWD") {
        els.fxWrap.classList.add("hidden");
        els.fxRate.value = "1";
        els.fxHint.textContent = "台幣不需匯率換算。";
      } else {
        els.fxWrap.classList.remove("hidden");
        els.fxHint.textContent = `1 ${currency} = 幾 TWD`;
        if (!els.fxRate.value) {
          els.fxRate.value = "";
        }
      }

      updateTWDPreview();
    }

    async function init(){
      let localSaved = null;
      try {
        const raw = localStorage.getItem("tx:" + id);
        localSaved = raw ? JSON.parse(raw) : null;
      } catch {}

      try {
        TX_DATA = await window.getTransactionFromCloud(id);
      } catch (e) {
        console.error("getTransactionFromCloud failed:", e);
        TX_DATA = null;
      }

      const fallbackData = {
        id,
        date: qs.get("date") || "",
        time: qs.get("time") || "",
        category: qs.get("cat") || "",
        note: qs.get("note") || "",
        amount: qs.get("amount") || "",
        currency: qs.get("currency") || "TWD",
        fxRateToTWD: qs.get("fxRateToTWD") || qs.get("fxRate") || "1",
        type: txTypeFromQs,
        bookId: localStorage.getItem("wis_currentBookId") || "",
      };

      const data = {
        ...fallbackData,
        ...(localSaved || {}),
        ...(TX_DATA || {}),
      };

      TX_TYPE = data.type || txTypeFromQs || "expense";

      const txBookId = data.bookId || localStorage.getItem("wis_currentBookId") || "";

      try {
        BOOK_DATA = await window.getBookDataFromCloud(txBookId);
      } catch (e) {
        console.error("getBookDataFromCloud failed:", e);
        BOOK_DATA = {};
      }

      AVAILABLE_CURRENCIES = buildAvailableCurrencies(BOOK_DATA);

      if (els.date) els.date.value = data.date || "";
      if (els.time) els.time.value = data.time || "";
      if (els.note) els.note.value = data.note || "";
      if (els.amount) els.amount.value = data.amount || "";

      await renderCategoryOptions(data.category || "");

      // 這裡就是關鍵：預設選這筆交易原本的幣別
      renderCurrencyOptions(data.currency || "TWD");

      els.fxRate.value = String(data.fxRateToTWD || "1");
      updateCurrencyUI();
    }

    async function save(){
      const currency = normalizeCurrency(els.currency?.value || "TWD");
      const amount = parseAmount(els.amount?.value);
      const fxRate = currency === "TWD" ? 1 : parseAmount(els.fxRate?.value);

      if (!isFinite(amount) || amount <= 0) {
        await window.ui.alert("請輸入正確金額（> 0）");
        return;
      }

      if (currency !== "TWD" && (!isFinite(fxRate) || fxRate <= 0)) {
        await window.ui.alert("請輸入正確匯率（> 0）");
        return;
      }

      const data = {
        id,
        date: els.date?.value || "",
        time: els.time?.value || "",
        category: (els.category?.value || "").trim(),
        note: (els.note?.value || "").trim(),
        amount,
        currency,
        fxRateToTWD: fxRate,
        amountTWD: currency === "TWD" ? amount : amount * fxRate,
      };

      localStorage.setItem("tx:" + id, JSON.stringify({
        ...(TX_DATA || {}),
        ...data,
      }));

      try {
        await window.saveToCloud(id, data);
      } catch (e) {
        console.error("saveToCloud failed:", e);
        await window.ui.alert("儲存失敗（雲端）：\n" + (e.code || "") + "\n" + (e.message || String(e)));
        return;
      }

      location.href = ref;
    }

    async function removeTx(){
      localStorage.removeItem("tx:" + id);
      localStorage.setItem("tx:deleted:" + id, "1");

      try {
        await window.deleteFromCloud(id);
      } catch (e) {
        console.error("deleteFromCloud failed:", e);
        await window.ui.alert("刪除失敗（雲端）：" + (e.message || e));
        return;
      }

      await window.ui.alert("已刪除");
      location.href = ref;
    }

    init();

    els.currency?.addEventListener("change", updateCurrencyUI);
    els.amount?.addEventListener("input", updateTWDPreview);
    els.fxRate?.addEventListener("input", updateTWDPreview);

    if (els.saveBtn) {
      els.saveBtn.addEventListener("click", async () => {
        await window.withButtonFeedback(
          els.saveBtn,
          async () => { await save(); },
          {
            loadingText: "儲存中…",
            successText: "已儲存 ✓",
            minShowMs: 120,
            onError: (e) => window.ui.alert("儲存失敗：" + (e.message || e)),
          }
        );
      });
    }

    if (els.deleteBtn) {
      els.deleteBtn.addEventListener("click", async () => {
        const ok = await window.ui.confirm("確定要刪除這筆明細嗎？", {
          title: "刪除明細",
          danger: true,
          okText: "刪除",
          cancelText: "取消",
        });
        if (!ok) return;
        await removeTx();
      });
    }

    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", (e) => {
        const href = link.getAttribute("href");
        if (!href || href.startsWith("#")) return;

        e.preventDefault();

        const page = document.querySelector(".page");
        if (!page) { location.href = href; return; }

        page.classList.add("leaving");
        setTimeout(() => { location.href = href; }, 200);
      });
    });
  </script>
</body>
</html>
