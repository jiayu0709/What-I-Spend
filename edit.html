<!doctype html>
<html lang="zh-Hant">
<head>
  <link rel="stylesheet" href="theme.css">
  <meta name="page" content="edit">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>編輯明細</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    }

    .app{min-height:100vh;padding-bottom:18px}
    .page{max-width:520px;margin:0 auto;padding:18px var(--page-padding) 28px}

    .card{background:var(--card-bg);border-radius:var(--radius);padding:16px}
    .field{display:grid;gap:8px;margin-top:14px;min-width:0}
    .field:first-child{margin-top:0}
    .label{font-size:14px;font-weight:900;color:var(--secondary)}

    .dual-field-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:14px;
      min-width:0;
      align-items:start;
    }

    .dual-field{
      display:grid;
      grid-template-rows:auto 52px;
      gap:8px;
      min-width:0;
    }

    .dual-field .label{
      margin:0;
      line-height:1.2;
    }

    .dual-field .input,
    .dual-field select{
      margin:0;
    }

    .input,
    input,
    select{
      width:100%;
      max-width:100%;
      box-sizing:border-box;
      height:52px;
      padding:0 12px;
      border-radius:10px;
      border:1px solid rgba(0,0,0,0.12);
      background:#fff;
      font-size:16px;
      line-height:52px;
    }

    input[type="date"],
    input[type="time"],
    select{
      display:block;
      appearance:none;
      -webkit-appearance:none;
    }

    select{
      line-height:normal;
      padding-top:0;
      padding-bottom:0;
      text-align:center;
      text-align-last:center;
      padding-left:12px;
      padding-right:12px;
    }
    select option{ text-align:center; }

    .input,
    input,
    select{
      text-align:center;
      color:var(--accent-text);
      -webkit-text-fill-color:var(--accent-text);
    }

    input[type="date"]::-webkit-datetime-edit,
    input[type="time"]::-webkit-datetime-edit{
      text-align:center;
      color:var(--accent-text);
      -webkit-text-fill-color:var(--accent-text);
    }
    input[type="date"]::-webkit-datetime-edit-text,
    input[type="date"]::-webkit-datetime-edit-month-field,
    input[type="date"]::-webkit-datetime-edit-day-field,
    input[type="date"]::-webkit-datetime-edit-year-field,
    input[type="time"]::-webkit-datetime-edit-text,
    input[type="time"]::-webkit-datetime-edit-hour-field,
    input[type="time"]::-webkit-datetime-edit-minute-field,
    input[type="time"]::-webkit-datetime-edit-ampm-field{
      color:var(--accent-text);
      -webkit-text-fill-color:var(--accent-text);
    }
    select option{ color:var(--accent-text); }

    .amount-card{
      display:grid;
      gap:12px;
      padding:14px;
      border-radius:16px;
      background:rgba(255,255,255,0.56);
      border:1px solid rgba(0,0,0,0.06);
    }

    .amount-main{
      display:grid;
      grid-template-columns:110px 1fr;
      gap:12px;
      align-items:center;
      min-height:56px;
    }

    .currency-pill{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.08);
      font-weight:900;
      font-size:18px;
      color:var(--text);
    }

    .amount-input{
      width:100%;
      height:56px;
      border:0;
      background:transparent;
      outline:none;
      font-size:34px;
      line-height:56px;
      font-weight:900;
      color:var(--text);
      padding:0;
      margin:0;
      min-width:0;
      text-align:left;
      -webkit-text-fill-color:var(--text);
    }

    .amount-input::placeholder{
      color:#b4b4b4;
      font-weight:800;
    }

    .fx-wrap{
      display:grid;
      gap:10px;
      padding-top:2px;
    }

    .fx-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      align-items:start;
    }

    .fx-row .field{
      margin-top:0;
    }

    .fx-row .label{
      margin:0;
      line-height:1.2;
      min-height:18px;
    }

    .preview-box{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:12px;
      min-height:52px;
      border-radius:12px;
      background:rgba(255,255,255,0.72);
      border:1px solid rgba(0,0,0,0.06);
    }

    .preview-value{
      font-size:18px;
      font-weight:900;
      color:var(--text);
      white-space:nowrap;
    }

    .hidden{
      display:none !important;
    }

    .btnbar{margin-top:14px;display:grid;gap:10px}

    .btn{
      width:100%;
      padding:14px 16px;
      border:0;
      outline:0;
      border-radius:var(--radius);
      background:var(--btn-secondary-bg, var(--card-bg));
      color:var(--btn-secondary-text, var(--accent-text));
      font-size:18px;
      font-weight:900;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
    }

    .btn.primary{
      background:var(--btn-primary-bg, var(--accent-text));
      color:var(--btn-primary-text, #fff);
    }

    .btn:active{opacity:.7;transform:scale(.98)}

    @media (max-width:420px){
      .dual-field-row{
        grid-template-columns:1fr 1fr;
        gap:10px;
      }

      .dual-field .label{
        font-size:13px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <main class="page">
      <div class="nav">
        <div class="nav-left">
          <button class="back-btn" id="backLink" type="button">‹ 返回</button>
        </div>
        <div class="nav-title">編輯明細</div>
        <div class="nav-right">
          <div class="book-badge" id="bookBadge" style="display:none;"></div>
        </div>
      </div>

      <div class="card">
        <div class="field">
          <div class="label">日期</div>
          <input class="input" type="date" id="date" />
        </div>

        <div class="field">
          <div class="label">時間</div>
          <input class="input" type="time" id="time" />
        </div>

        <div class="dual-field-row">
          <div class="dual-field">
            <div class="label">分類</div>
            <select class="input" id="category"></select>
          </div>

          <div class="dual-field">
            <div class="label">幣別</div>
            <select class="input" id="currency"></select>
          </div>
        </div>

        <div class="field">
          <div class="label">錢包</div>
          <select class="input" id="wallet"></select>
        </div>

        <div class="field">
          <div class="label">金額</div>
          <div class="amount-card">
            <div class="amount-main">
              <div class="currency-pill" id="currencyPill">TWD</div>
              <input
                class="amount-input"
                type="number"
                id="amount"
                inputmode="decimal"
                placeholder="0"
              />
            </div>

            <div class="fx-wrap hidden" id="fxWrap">
              <div class="fx-row">
                <div class="field">
                  <div class="label">匯率</div>
                  <input
                    class="input"
                    type="number"
                    id="fxRate"
                    inputmode="decimal"
                    placeholder="1 外幣 = 幾 TWD"
                  />
                </div>

                <div class="field">
                  <div class="label">台幣金額</div>
                  <div class="preview-box">
                    <div class="preview-value" id="amountTWDPreview">NT$0</div>
                  </div>
                </div>
              </div>

              <div class="hint" id="fxHint">外幣會依匯率換算台幣。</div>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="label">備註</div>
          <input class="input" type="text" id="note" placeholder="（可空）" />
        </div>
      </div>

      <div class="btnbar">
        <button class="btn primary" id="saveBtn" type="button">儲存</button>
        <button class="btn" type="button" id="deleteBtn">刪除</button>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>

  <script type="module">
    import {
      doc,
      updateDoc,
      deleteDoc,
      getDoc,
      collection,
      getDocs,
      query,
      where,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { db } from "./firebase-config.js";

    window.pageLoader?.show("讀取中…");

    const qs = new URLSearchParams(location.search);
    const id = qs.get("id") || "tx-unknown";
    const ref = qs.get("ref") || "month.html";
    const txTypeFromQs = qs.get("type") || "expense";

    const DEFAULT_CATEGORIES = {
      expense: ["餐飲🥣","飲料🥤","交通🛵","日用🛍️","娛樂🎮","醫療🏥","治裝👗","家用🏠","旅遊🧳","其他🧶"],
      income: ["薪資💼","獎金🎁","兼職🧑‍💻","投資📈","退款💵","其他🧶"],
    };

    const els = {
      date: document.getElementById("date"),
      time: document.getElementById("time"),
      category: document.getElementById("category"),
      currency: document.getElementById("currency"),
      wallet: document.getElementById("wallet"),
      currencyPill: document.getElementById("currencyPill"),
      amount: document.getElementById("amount"),
      fxWrap: document.getElementById("fxWrap"),
      fxRate: document.getElementById("fxRate"),
      fxHint: document.getElementById("fxHint"),
      amountTWDPreview: document.getElementById("amountTWDPreview"),
      note: document.getElementById("note"),
      saveBtn: document.getElementById("saveBtn"),
      deleteBtn: document.getElementById("deleteBtn"),
      backLink: document.getElementById("backLink"),
      bookBadge: document.getElementById("bookBadge"),
    };

    let BOOK_DATA = {};
    let AVAILABLE_CURRENCIES = ["TWD"];
    let TX_DATA = null;
    let TX_TYPE = txTypeFromQs;
    let ALL_WALLETS = [];

    function normalizeCurrency(v){
      return String(v || "TWD").trim().toUpperCase();
    }

    function parseAmount(v){
      const n = Number(String(v ?? "").replace(/,/g, ""));
      return isFinite(n) ? n : NaN;
    }

    function moneyNT(n){
      const v = Number(n || 0);
      return "NT$" + Math.round(v).toLocaleString("en-US");
    }

    async function getTransactionFromCloud(id) {
      const user = await window.requireAuth();
      if (!user) throw new Error("Not logged in");

      const ref = doc(db, "users", user.uid, "transactions", id);
      const snap = await getDoc(ref);
      return snap.exists() ? { id: snap.id, ...snap.data() } : null;
    }

    async function getBookDataFromCloud(bookId, { force = false } = {}) {
      const user = await window.requireAuth();
      if (!user) throw new Error("Not logged in");
      if (!bookId) throw new Error("No bookId");

      if (!force) {
        const cached = window.dataUtils?.getCachedBook(user.uid, bookId);
        if (cached) return cached;
      }

      const ref = doc(db, "users", user.uid, "books", bookId);
      const snap = await getDoc(ref);
      const data = snap.exists() ? (snap.data() || {}) : {};

      window.dataUtils?.setCachedBook(user.uid, bookId, data);
      return data;
    }

    async function getWalletsFromCloud(bookId, { force = false } = {}) {
      const user = await window.requireAuth();
      if (!user) throw new Error("Not logged in");
      if (!bookId) return [];

      if (!force) {
        const cached = window.dataUtils?.getCachedWallets(user.uid, bookId);
        if (cached) return cached;
      }

      const ref = collection(db, "users", user.uid, "books", bookId, "wallets");

      let wallets = [];
      try {
        const snap = await getDocs(query(
          ref,
          where("archived", "==", false),
          orderBy("createdAt", "asc")
        ));
        wallets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {
        const snap = await getDocs(ref);
        wallets = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(w => w.archived !== true)
          .sort((a, b) => {
            const aSec = a?.createdAt?.seconds || 0;
            const bSec = b?.createdAt?.seconds || 0;
            return aSec - bSec;
          });
      }

      window.dataUtils?.setCachedWallets(user.uid, bookId, wallets);
      return wallets;
    }

    async function saveToCloud(id, data) {
      const user = await window.requireAuth();
      if (!user) throw new Error("Not logged in");

      const ref = doc(db, "users", user.uid, "transactions", id);
      await updateDoc(ref, {
        date: data.date,
        time: data.time,
        category: data.category,
        note: data.note,
        amount: data.amount,
        currency: data.currency,
        fxRateToTWD: data.fxRateToTWD,
        amountTWD: data.amountTWD,
        walletId: data.walletId || "",
        walletName: data.walletName || "",
      });
    }

    async function deleteFromCloud(id) {
      const user = await window.requireAuth();
      if (!user) throw new Error("Not logged in");

      const ref = doc(db, "users", user.uid, "transactions", id);
      await deleteDoc(ref);
    }

    function buildAvailableCurrencies(bookData = {}) {
      const list = ["TWD"];
      const foreign = normalizeCurrency(bookData?.settings?.foreignCurrency || "");

      if (foreign && foreign !== "TWD") {
        list.push(foreign);
      }

      return list;
    }

    function getWalletsByCurrency(currency) {
      const cur = normalizeCurrency(currency);
      return ALL_WALLETS.filter(w => normalizeCurrency(w.currency || "TWD") === cur);
    }

    function renderWalletOptions(selectedWalletId = "") {
      const currency = normalizeCurrency(els.currency.value || "TWD");
      const wallets = getWalletsByCurrency(currency);
      const selected = String(selectedWalletId || "").trim();

      els.wallet.innerHTML = "";

      for (const wallet of wallets) {
        const opt = document.createElement("option");
        opt.value = wallet.id;
        opt.textContent = wallet.name || "未命名錢包";
        els.wallet.appendChild(opt);
      }

      const currentTxWallet = ALL_WALLETS.find(w => w.id === selected);

      if (selected && wallets.some(w => w.id === selected)) {
        els.wallet.value = selected;
      } else if (currentTxWallet && normalizeCurrency(currentTxWallet.currency) !== currency) {
        const opt = document.createElement("option");
        opt.value = currentTxWallet.id;
        opt.textContent = `${currentTxWallet.name || "未命名錢包"}（原錢包）`;
        els.wallet.insertBefore(opt, els.wallet.firstChild);
        els.wallet.value = currentTxWallet.id;
      } else if (wallets.length > 0) {
        els.wallet.value = wallets[0].id;
      }
    }

    async function renderCategoryOptions(currentValue){
      const categories = BOOK_DATA.categories || {};
      const source =
        TX_TYPE === "income"
          ? (categories.income || DEFAULT_CATEGORIES.income)
          : (categories.expense || DEFAULT_CATEGORIES.expense);

      els.category.innerHTML = "";

      for (const name of source) {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        els.category.appendChild(opt);
      }

      const cur = String(currentValue || "").trim();

      if (cur && !source.includes(cur)) {
        const opt = document.createElement("option");
        opt.value = cur;
        opt.textContent = cur;
        els.category.insertBefore(opt, els.category.firstChild);
      }

      els.category.value = cur || source[0] || "";
    }

    function renderCurrencyOptions(currentValue = ""){
      els.currency.innerHTML = "";

      for (const c of AVAILABLE_CURRENCIES) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        els.currency.appendChild(opt);
      }

      const cur = normalizeCurrency(currentValue || "TWD");

      if (cur && !AVAILABLE_CURRENCIES.includes(cur)) {
        const opt = document.createElement("option");
        opt.value = cur;
        opt.textContent = cur;
        els.currency.insertBefore(opt, els.currency.firstChild);
      }

      els.currency.value = cur;
    }

    function updateTWDPreview() {
      const currency = normalizeCurrency(els.currency.value || "TWD");
      const amount = parseAmount(els.amount.value);
      const fxRate = parseAmount(els.fxRate.value);

      if (!isFinite(amount) || amount <= 0) {
        els.amountTWDPreview.textContent = "NT$0";
        return;
      }

      if (currency === "TWD") {
        els.amountTWDPreview.textContent = moneyNT(amount);
        return;
      }

      if (!isFinite(fxRate) || fxRate <= 0) {
        els.amountTWDPreview.textContent = "NT$0";
        return;
      }

      els.amountTWDPreview.textContent = moneyNT(amount * fxRate);
    }

    function updateCurrencyUI({ keepWalletId = "" } = {}) {
      const currency = normalizeCurrency(els.currency.value || "TWD");
      els.currencyPill.textContent = currency;

      if (currency === "TWD") {
        els.fxWrap.classList.add("hidden");
        els.fxRate.value = "1";
        els.fxHint.textContent = "台幣不需匯率換算。";
      } else {
        els.fxWrap.classList.remove("hidden");
        els.fxHint.textContent = `1 ${currency} = 幾 TWD`;
        if (!els.fxRate.value) els.fxRate.value = "";
      }

      renderWalletOptions(keepWalletId || els.wallet.value || TX_DATA?.walletId || "");
      updateTWDPreview();
    }

    async function init(){
      let localSaved = null;
      try {
        const raw = localStorage.getItem("tx:" + id);
        localSaved = raw ? JSON.parse(raw) : null;
      } catch {}

      try {
        TX_DATA = await getTransactionFromCloud(id);
      } catch (e) {
        console.error("getTransactionFromCloud failed:", e);
        TX_DATA = null;
      }

      const fallbackData = {
        id,
        date: qs.get("date") || "",
        time: qs.get("time") || "",
        category: qs.get("cat") || "",
        note: qs.get("note") || "",
        amount: qs.get("amount") || "",
        currency: qs.get("currency") || "TWD",
        fxRateToTWD: qs.get("fxRateToTWD") || qs.get("fxRate") || "1",
        type: txTypeFromQs,
        bookId: localStorage.getItem("wis_currentBookId") || "",
        walletId: "",
        walletName: "",
      };

      const data = {
        ...fallbackData,
        ...(localSaved || {}),
        ...(TX_DATA || {}),
      };

      TX_DATA = data;
      TX_TYPE = data.type || txTypeFromQs || "expense";

      const txBookId = data.bookId || localStorage.getItem("wis_currentBookId") || "";

      try {
        const [bookData, wallets] = await Promise.all([
          getBookDataFromCloud(txBookId),
          getWalletsFromCloud(txBookId),
        ]);

        BOOK_DATA = bookData || {};
        ALL_WALLETS = wallets || [];
      } catch (e) {
        console.error("load book/wallets failed:", e);
        BOOK_DATA = {};
        ALL_WALLETS = [];
      }

      AVAILABLE_CURRENCIES = buildAvailableCurrencies(BOOK_DATA);

      els.date.value = data.date || "";
      els.time.value = data.time || "";
      els.note.value = data.note || "";
      els.amount.value = data.amount || "";

      const bookName = String(BOOK_DATA?.name || "").trim();
      if (bookName) {
        els.bookBadge.textContent = bookName;
        els.bookBadge.title = bookName;
        els.bookBadge.style.display = "inline-flex";
      }

      await renderCategoryOptions(data.category || "");
      renderCurrencyOptions(data.currency || "TWD");

      els.fxRate.value = String(data.fxRateToTWD || "1");
      updateCurrencyUI({ keepWalletId: data.walletId || "" });
    }

    async function save(){
      const currency = normalizeCurrency(els.currency.value || "TWD");
      const amount = parseAmount(els.amount.value);
      const fxRate = currency === "TWD" ? 1 : parseAmount(els.fxRate.value);
      const walletId = String(els.wallet.value || "").trim();
      const wallet = ALL_WALLETS.find(w => w.id === walletId) || null;
      const walletName = wallet?.name || "";

      if (!isFinite(amount) || amount <= 0) {
        await window.ui.alert("請輸入正確金額（> 0）");
        return;
      }

      if (currency !== "TWD" && (!isFinite(fxRate) || fxRate <= 0)) {
        await window.ui.alert("請輸入正確匯率（> 0）");
        return;
      }

      if (!walletId) {
        await window.ui.alert("請選擇錢包");
        return;
      }

      if (normalizeCurrency(wallet?.currency || "") !== currency) {
        await window.ui.alert("所選錢包幣別與目前幣別不一致");
        return;
      }

      const data = {
        id,
        date: els.date.value || "",
        time: els.time.value || "",
        category: (els.category.value || "").trim(),
        note: (els.note.value || "").trim(),
        amount,
        currency,
        fxRateToTWD: fxRate,
        amountTWD: currency === "TWD" ? amount : amount * fxRate,
        walletId,
        walletName,
      };

      localStorage.setItem("tx:" + id, JSON.stringify({
        ...(TX_DATA || {}),
        ...data,
      }));

      await saveToCloud(id, data);

      const user = await window.waitForAuthReady();
      const bookId = TX_DATA?.bookId || localStorage.getItem("wis_currentBookId") || "";
      if (user && bookId) {
        window.dataUtils?.clearWalletCache(user.uid, bookId);
      }

      location.href = ref;
    }

    async function removeTx(){
      localStorage.removeItem("tx:" + id);
      localStorage.setItem("tx:deleted:" + id, "1");
      await deleteFromCloud(id);

      const user = await window.waitForAuthReady();
      const bookId = TX_DATA?.bookId || localStorage.getItem("wis_currentBookId") || "";
      if (user && bookId) {
        window.dataUtils?.clearWalletCache(user.uid, bookId);
      }

      await window.ui.alert("已刪除");
      location.href = ref;
    }

    els.backLink?.addEventListener("click", () => {
      location.href = ref;
    });

    els.currency?.addEventListener("change", () => {
      updateCurrencyUI({ keepWalletId: "" });
    });

    els.amount?.addEventListener("input", updateTWDPreview);
    els.fxRate?.addEventListener("input", updateTWDPreview);

    els.saveBtn?.addEventListener("click", async () => {
      await window.withButtonFeedback(
        els.saveBtn,
        async () => { await save(); },
        {
          loadingText: "儲存中…",
          successText: "已儲存 ✓",
          minShowMs: 120,
          onError: (e) => window.ui.alert("儲存失敗：" + (e.message || e)),
        }
      );
    });

    els.deleteBtn?.addEventListener("click", async () => {
      const ok = await window.ui.confirm("確定要刪除這筆明細嗎？", {
        title: "刪除明細",
        danger: true,
        okText: "刪除",
        cancelText: "取消",
      });
      if (!ok) return;
      await removeTx();
    });

    try {
      await init();
    } finally {
      window.pageLoader?.hide();
    }
  </script>
</body>
</html>
