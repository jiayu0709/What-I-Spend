<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="theme.css">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="What I Spend">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f2ede9">

  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>What I Spend</title>

  <style>
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      background: var(--app-bg, #f2ede9);
      color: var(--text, #3c3c3c);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .app{
      min-height:100vh;
      display:flex;
      justify-content:center;
    }

    .page{
      width:100%;
      max-width:520px;
      padding:18px var(--page-padding,16px) 28px;
      display:grid;
      gap:14px;
    }

    /* ===== Big cards ===== */
    .big-card{
      background: var(--card-bg, rgba(255,255,255,0.72));
      border-radius: var(--radius, 22px);
      padding:16px;
    }

    .hero{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .title{
      font-size:42px;
      font-weight:900;
      letter-spacing:-.8px;
      margin:8px 0 6px;
      line-height:1.05;
    }

    .subtitle{
      margin:0;
      color: var(--secondary, #fff);
      font-weight:900;
      line-height:1.5;
      font-size:16px;
    }

    .logo{
      width:78px;
      height:78px;
      border-radius:22px;
      display:grid;
      place-items:center;
      font-size:47px;
      background: rgba(255,255,255,0.75);
      flex:0 0 auto;
      transform: translateY(14px);
    }

    /* ===== Small feature cards inside Big Card A ===== */
    .features{
      margin-top:12px;
      display:grid;
      gap:12px;
    }

    .feature{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.55);
    }

    .f-ic{
      width:44px;height:44px;
      border-radius:14px;
      display:grid;place-items:center;
      background: rgba(0,0,0,0.06);
      flex:0 0 auto;
      font-size:22px;
    }

    .f-t{
      font-weight:900;
      font-size:18px;
      letter-spacing:-.2px;
      line-height:1.2;
    }

    .f-d{
      margin-top:4px;
      font-weight:900;
      color: var(--secondary, #8e8e93);
      font-size:14px;
      line-height:1.3;
    }

    /* ===== Big Card B steps ===== */
    .card-title{
      font-size:20px;
      font-weight:900;
      letter-spacing:-.2px;
      margin:2px 0 10px;
    }

    .steps{
      display:grid;
      gap:12px;
    }

    .step{
      display:flex;
      gap:10px;
      align-items:center;
      padding:14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.55);
    }

    .badge{
      width:30px;height:30px;
      border-radius:12px;
      background: rgba(0,0,0,0.06);
      display:grid;place-items:center;
      font-weight:900;
      font-size:14px;
      flex:0 0 auto;
    }

    .step .t{ font-weight:900; font-size:16px; line-height:1.25; }
    .step .d{
      font-weight:900;
      color: var(--secondary, #8e8e93);
      font-size:13px;
      margin-top:4px;
      line-height:1.35;
    }

    /* ===== Action button ===== */
    .actions{
      margin-top:14px;
      display:flex;
      justify-content:center;
    }

    .actions .btn{
      width:100%;
    }

    .btn{
      width:100%;
      padding:16px 16px;
      border-radius: var(--radius, 22px);
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      border:0;
      background: var(--card-bg, rgba(255,255,255,0.72));
      color: var(--accent-text, var(--text, #3c3c3c));
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    .btn.primary{
      background: var(--accent-text);
      color:#fff;
    }

    .btn:active{ transform:scale(.99); opacity:.85; }

    /* Toast */
    .toast{
      position:fixed;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 18px);
      transform:translateX(-50%);
      background:rgba(0,0,0,0.82);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      z-index:9999;
    }
    .toast.show{ opacity:1; }
  </style>
</head>

<body>
  <div class="app">
    <main class="page">

      <!-- ✅ Big Card A：開始使用 + icon + 三個優點 -->
      <section class="big-card" aria-label="App 優點">
        <div class="hero">
          <div>
            <div class="title">歡迎使用</div>
            <p class="subtitle">
              捷徑 × 雲端同步<br>
              實現真正的背景快速記帳
            </p>
          </div>
          <div class="logo">💰</div>
        </div>

        <div class="features">
          <div class="feature">
            <div class="f-ic">✅</div>
            <div>
              <div class="f-t">捷徑一鍵記帳</div>
              <div class="f-d">不用開 app、快速記帳</div>
            </div>
          </div>

          <div class="feature">
            <div class="f-ic">☁️</div>
            <div>
              <div class="f-t">自動同步雲端</div>
              <div class="f-d">手機 / 電腦都能查看與編輯</div>
            </div>
          </div>

          <div class="feature">
            <div class="f-ic">🔒</div>
            <div>
              <div class="f-t">每個人獨立帳戶</div>
              <div class="f-d">登入後所有裝置都能看見記帳</div>
            </div>
          </div>
        </div>
      </section>

      <!-- ✅ Big Card B：Safari 開啟流程 + 按鈕 -->
      <section class="big-card" aria-label="Safari 開啟流程">
        <div class="card-title">請使用 Safari 開啟</div>

        <div class="steps">
          <div class="step">
            <div class="badge">1</div>
            <div>
              <div class="t">點右上角或右下角「⋯ / 分享」</div>
              <div class="d">LINE、IG、FB 內建瀏覽器都可以</div>
            </div>
          </div>

          <div class="step">
            <div class="badge">2</div>
            <div>
              <div class="t">選擇「在瀏覽器中開啟」</div>
              <div class="d">避免 Google 登入被系統阻擋</div>
            </div>
          </div>
        </div>

        <div class="actions">
          <!-- ✅ 保留原本 copyBtn id 與功能 -->
          <button class="btn primary" id="copyBtn">📋 複製 Safari 登入連結</button>
        </div>
      </section>

    </main>
  </div>

  <div class="toast" id="toast">已複製連結，請貼到 Safari 開啟 ✅</div>

  <script>
    // ===== copy safari login url =====
    const loginUrl = new URL("a2hs.html", location.href).toString();
    const copyBtn = document.getElementById("copyBtn");
    const toast = document.getElementById("toast");

    copyBtn.addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(loginUrl);
      }catch{
        const t = document.createElement("textarea");
        t.value = loginUrl;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        document.body.removeChild(t);
      }
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    });
  </script>

  <script type="module">
    // ===== 判斷：只有「真正 Safari + 非主畫面」才自動離開導覽頁 =====
    function isRealSafari(){
      const ua = navigator.userAgent || "";
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      return (
        isIOS &&
        /Safari/i.test(ua) &&
        !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo|Line|FBAN|FBAV|Instagram/i.test(ua)
      );
    }
    const isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia?.("(display-mode: standalone)")?.matches;

      // ✅ 從主畫面 icon 開啟（standalone）→ 直接去登入頁
    if (isStandalone) {
      location.replace("waiting.html");
    }

    if (isRealSafari() && !isStandalone) {
      // ✅ 防止卡住：如果 firebaseReady 一直沒起來，直接去 a2hs
      const fallback = setTimeout(() => {
        location.replace("a2hs.html");
      }, 1200);

      try{
        await window.firebaseReady;
        clearTimeout(fallback);

        const user = await window.waitForAuthReady?.();

        // ✅ 重點改這裡：Safari 內「未登入」也先去 a2hs
        if (!user) {
          location.replace("a2hs.html");
        } else {
          try{
            const { db } = await import("./firebase-config.js");
            const { doc, getDoc, setDoc, serverTimestamp } =
              await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");

            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);

            if (!snap.exists()) {
              await setDoc(userRef, {
                createdAt: serverTimestamp(),
                a2hsDone: false,
              });
              location.replace("a2hs.html");
            } else {
              const data = snap.data() || {};
              if (data.a2hsDone === false) {
                location.replace("a2hs.html");
              } else {
                location.replace("month.html");
              }
            }
          }catch(e){
            console.error("index route failed:", e);
            location.replace("month.html");
          }
        }
      }catch(e){
        console.error("firebaseReady failed:", e);
        // 任何錯誤都不要停在導覽頁
        location.replace("a2hs.html");
      }
    }
  </script>

  <script type="module" src="app.js"></script>
</body>
</html>
